---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KUBECONFORM_SCRIPT: "{{.SCRIPTS_DIR}}/kubeconform.sh"

tasks:

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: resource }
        cmd: kubectl get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    vars:
      resource: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods

  lint:
    desc: Lint all YAML files with yamllint
    cmds:
      - yamllint -c .github/lint/.yamllint.yaml $(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*' -not -path './.claude/*')
    preconditions:
      - msg: yamllint is not installed
        sh: command -v yamllint

  kubeconform:
    desc: Validate Kubernetes manifests with kubeconform
    cmd: bash {{.KUBECONFORM_SCRIPT}} {{.KUBERNETES_DIR}}
    preconditions:
      - msg: kubeconform is not installed
        sh: command -v kubeconform
      - msg: Missing kubeconform script
        sh: test -f {{.KUBECONFORM_SCRIPT}}

  locate-node:
    desc: Rapidly blink a Raspberry Pi node's ACT/PWR LEDs to find it in the rack (Ctrl-C restores them)
    cmds:
      - defer: kubectl -n kube-system delete pod locate-{{.node}} --ignore-not-found --wait=false
      - |
        kubectl -n kube-system run locate-{{.node}} --rm -i --restart=Never --image=busybox:1.36 \
          --overrides='{"spec":{"nodeName":"{{.node}}","tolerations":[{"operator":"Exists"}],"terminationGracePeriodSeconds":5,
            "containers":[{"name":"blink","image":"busybox:1.36","securityContext":{"privileged":true},"command":["sh","-c",
            "L=/sys/class/leds; restore() { echo mmc0 > $L/ACT/trigger; echo default-on > $L/PWR/trigger; exit 0; }; trap restore TERM INT; for l in ACT PWR; do echo timer > $L/$l/trigger; echo 100 > $L/$l/delay_on; echo 100 > $L/$l/delay_off; done; echo blinking {{.node}}, Ctrl-C to stop; sleep {{.seconds}} & wait; restore"]}]}}'
    vars:
      seconds: '{{.seconds | default "600"}}'
    requires:
      vars: ["node"]
    preconditions:
      - msg: Node not found
        sh: kubectl get node {{.node}}

  .reset:
    internal: true
    cmd: rm -rf {{.KUBERNETES_DIR}}
