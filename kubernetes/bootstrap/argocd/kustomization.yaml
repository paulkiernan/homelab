---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - argocd-bootstrap-application.yaml
  - root-applicationset.yaml
  - helm-repo-bitnami.yaml
  - tailscale-ingress.yaml
  - serverstransport.yaml
  - helm-repo-couchdb.yaml
  # Scrapes the application controller so ArgoCD's own reconciliation is
  # alertable; see the file header for the failure it was added to catch.
  - metrics-servicemonitor.yaml

patches:
  - path: argocd-cm.patch.yaml
