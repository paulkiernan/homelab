---
# LAN access: https://piano.paulynomial.com, resolved to Traefik's MetalLB IP
# (192.168.1.233) by an AdGuard rule:
#   |piano.paulynomial.com^$dnsrewrite=NOERROR;A;192.168.1.233,important
#
# NOT PUBLIC, and that depends on the entrypoint pin below. *.paulynomial.com
# is a proxied wildcard to the Cloudflare tunnel (terraform/dns_paulynomial.com.tf)
# and cloudflared forwards every *.paulynomial.com host to traefik:80, the `web`
# entrypoint. An unpinned Ingress gets a router on `web` too (that is how
# books/vtt/home are public), so this one is pinned to `websecure` (:443) only.
# Through the tunnel piano.paulynomial.com then matches no router and gets
# Traefik's 404. If cloudflared is ever pointed at :443, this goes public.
#
# Side effect: no http:// -> https:// redirect on the LAN (nothing listens on
# :80 for this host). The app is configured with the https URL anyway.
#
# Uploads: Traefik has no body size limit, but its entrypoints keep the default
# 60s readTimeout, so a request through here must finish uploading within a
# minute (50 MB needs ~7 Mbit/s; trivial on the LAN). The tailnet ingress
# skips Traefik and has no such limit. The server's own limit is 1000 MB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sheetopia-lan
  namespace: sheetopia
  labels:
    app: sheetopia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: piano.paulynomial.com
      http:
        paths:
          - backend:
              service:
                name: sheetopia
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - piano.paulynomial.com
      secretName: piano-paulynomial-com-tls
