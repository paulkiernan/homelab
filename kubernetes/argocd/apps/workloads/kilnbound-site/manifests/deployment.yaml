---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kilnbound-site
  namespace: kilnbound-site
  labels:
    app: kilnbound-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kilnbound-site
  template:
    metadata:
      labels:
        app: kilnbound-site
    spec:
      # The image is private on GHCR; this is the same pull secret home,
      # ireland and tidewood-booking use (ghcr-pull-secret.sops.yaml).
      imagePullSecrets:
        - name: dockerconfigjson-github-com
      containers:
        - name: kilnbound-site
          # Pinned to a site release (site-vX.Y.Z in the kilnbound repository).
          # Its Site workflow rewrites this line on every release.
          image: ghcr.io/paulkiernan/kilnbound-site:0.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 3
          # A Next.js Node server (it was nginx serving static files). It idles
          # around 140Mi and was measured near 290Mi after a few thousand
          # requests, on macOS; revisit the limit against real usage here.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
