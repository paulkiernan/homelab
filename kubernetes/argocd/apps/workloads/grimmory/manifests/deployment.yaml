---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booklore
  namespace: booklore
  labels:
    app: booklore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booklore
  template:
    metadata:
      labels:
        app: booklore
    spec:
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.38
          command: ['sh', '-c', 'until nc -z mariadb 3306; do echo waiting for mariadb; sleep 2; done;']
      containers:
        - name: booklore
          image: ghcr.io/grimmory-tools/grimmory:v3.5.0
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: "jdbc:mariadb://mariadb:3306/booklore"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: password
            - name: DISK_TYPE
              value: "LOCAL"
            - name: TZ
              value: "America/Los_Angeles"
            - name: USER_ID
              value: "1000"
            - name: GROUP_ID
              value: "1000"
            - name: BOOKLORE_PORT
              value: "6060"
          ports:
            - containerPort: 6060
              name: http
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: books
              mountPath: /books
            - name: bookdrop
              mountPath: /bookdrop
          resources:
            # Spring boot is CPU-bound; a CPU limit would only throttle it into
            # outlasting the startup probe, so request half a core and let it
            # burst. The memory limit also bounds the JVM, whose image sets
            # MaxRAMPercentage=60 and would otherwise size off the node's RAM.
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1536Mi
          # Cold start takes 3+ minutes on a busy node, longer than the old 180s
          # budget, so the kubelet killed it just short of ready on every boot.
          # Allow up to 10 minutes before liveness takes over.
          startupProbe:
            httpGet:
              path: /
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 57
          livenessProbe:
            httpGet:
              path: /
              port: 6060
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 6060
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: booklore-data
        - name: books
          persistentVolumeClaim:
            claimName: booklore-books
        - name: bookdrop
          persistentVolumeClaim:
            claimName: booklore-bookdrop
