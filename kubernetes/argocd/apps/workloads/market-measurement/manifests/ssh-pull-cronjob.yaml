---
# Pull sealed capture chunks from the cloud capture VM (Lightsail) onto the NAS
# over rsync/SSH, then verify each SHA256 against its manifest. This is the
# transport between the two capture sites: the VM's spool is copied here
# without any cloud API, agent or anonymous file service, and nothing is ever
# deleted on the remote side.
#
# ACTIVE since 2026-09-17. The capture VM exists (Lightsail market-measurement,
# 107.21.239.171, site aws-us-east-1), the read-only pull key is authorized on
# it, the SOPS-encrypted Secret has synced, and one manual
# `task measurement:pull-run` Job proved the transport (all sealed chunks on
# the VM arrived on the NAS with matching SHA256s) before suspend was lifted.
# The activation order that was followed, each step only after the previous
# one really completed:
#   1. provision the capture VM (terraform/market-measurement) and authorize
#      the read-only pull key on it with deploy/systemd/authorize-pull-key.sh
#      in paulkiernan/diff-logic-cells;
#   2. commit the SOPS-encrypted Secret written by `task measurement:pull-secret`
#      (manifests/ssh-pull-secret.sops.yaml plus its kustomization entry) and
#      let ArgoCD auto-sync;
#   3. confirm one successful `task measurement:pull-run` Job;
#   4. set spec.suspend to false in Git and let ArgoCD sync it.
# Failures stay visible: a missing Secret, an unpinned host key or an
# unreachable VM fails the pod. The transport never skips a missing Secret and
# never reports success without copying.
#
# The remote account is a forced-command, read-only rrsync account created by
# deploy/systemd/authorize-pull-key.sh in paulkiernan/diff-logic-cells. The
# private key, the pinned host keys and the host coordinates come from the
# SOPS-encrypted Secret generated by `task measurement:pull-secret` (in
# .taskfiles/measurement) from locally held key material:
#
#   kubectl -n market-measurement get secret market-measurement-pull-ssh
#     required keys: id_ed25519, known_hosts, remote_host, remote_user,
#                    remote_port
#   (the remote path is not a Secret value: rrsync already roots the account at
#    the spool, so the client always asks for "/")
#
# `task measurement:pull-run` starts a one-off pull from this CronJob and is
# the routine transport check; it was used to prove the path before the
# schedule was enabled.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-archive-pull
  namespace: market-measurement
  labels:
    app.kubernetes.io/name: market-archive-pull
    app.kubernetes.io/part-of: market-measurement
spec:
  # Active transport: one manual Job proved the pull path (Secret synced,
  # pinned host keys accepted, chunks hash-verified on the NAS) before this was
  # enabled in Git. Keep this in Git; never edit the live object.
  suspend: false
  # Every 15 minutes: the pull is incremental, and sealed chunks are only a
  # rotation behind at worst. The cloud VM keeps its spool until an operator
  # prunes it, so a failed pull window is recoverable, never lost.
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      # ttlSecondsAfterFinished belongs to the Job spec, not the CronJob spec:
      # the CronJob field is invalid and kubeconform rejects it.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-archive-pull
            app.kubernetes.io/part-of: market-measurement
        spec:
          restartPolicy: Never
          # rsync/SSH out and local volumes in; no Kubernetes API, no SA token.
          automountServiceAccountToken: false
          enableServiceLinks: false
          imagePullSecrets:
            - name: market-measurement-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: archive-permissions
              image: busybox:1.37
              command:
                - sh
                - -c
                - chown 65532:65532 /archive
              securityContext:
                # See recorder-deployment.yaml: taking ownership of the
                # provisioner-created NAS directory needs CAP_CHOWN, so the
                # pod-level runAsNonRoot is overridden for this init step.
                runAsNonRoot: false
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - FOWNER
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              volumeMounts:
                - name: archive
                  mountPath: /archive
            # Secret volumes are root-owned, and ssh refuses a key that other
            # users can read. Stage a 0600 copy owned by the runtime uid in an
            # emptyDir instead of loosening the secret's mode.
            - name: ssh-key-staging
              image: busybox:1.37
              command:
                - sh
                - -c
                - cp /keys/id_ed25519 /run/ssh/id_ed25519 && cp /keys/known_hosts /run/ssh/known_hosts && chown -R 65532:65532 /run/ssh && chmod 0600 /run/ssh/id_ed25519 && chmod 0644 /run/ssh/known_hosts
              securityContext:
                # Runs as root inside an emptyDir it owns: copying the staged
                # key and handing it to the runtime uid needs CHOWN. Nothing
                # else is elevated, and the secret volume itself stays 0400.
                runAsNonRoot: false
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - FOWNER
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              volumeMounts:
                - name: pull-ssh
                  mountPath: /keys
                  readOnly: true
                - name: ssh-staging
                  mountPath: /run/ssh
          containers:
            - name: pull
              image: ghcr.io/paulkiernan/diff-logic-cells/market-research:v0.1.0
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/ssh-pull.sh
              env:
                # remote_host must appear in known_hosts exactly as written
                # here: the script always uses StrictHostKeyChecking=yes.
                - name: MSR_REMOTE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: market-measurement-pull-ssh
                      key: remote_host
                - name: MSR_REMOTE_USER
                  valueFrom:
                    secretKeyRef:
                      name: market-measurement-pull-ssh
                      key: remote_user
                - name: MSR_REMOTE_PORT
                  valueFrom:
                    secretKeyRef:
                      name: market-measurement-pull-ssh
                      key: remote_port
                # "/" is the rrsync root, which the forced command already
                # points at the spool: the key on the capture host carries
                # `restrict,command="rrsync -ro /var/lib/market-recorder"`, so
                # asking for the absolute spool path here would resolve below
                # that root and copy nothing. Deliberately NOT taken from the
                # Secret: there is no per-host value to get wrong.
                - name: MSR_REMOTE_PATH
                  value: "/"
                - name: MSR_IDENTITY
                  value: /run/ssh/id_ed25519
                - name: MSR_KNOWN_HOSTS
                  value: /run/ssh/known_hosts
                - name: MSR_DEST
                  value: /archive
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: ssh-staging
                  mountPath: /run/ssh
                  readOnly: true
                - name: archive
                  mountPath: /archive
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: market-measurement-scripts
                defaultMode: 0555
            - name: pull-ssh
              secret:
                secretName: market-measurement-pull-ssh
                defaultMode: 0400
            - name: ssh-staging
              emptyDir:
                sizeLimit: 16Mi
            - name: archive
              persistentVolumeClaim:
                claimName: market-archive
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
