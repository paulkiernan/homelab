---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Read-only Coinbase US futures measurement: one capture writer, one archive
# helper, a batch report job, the SSH pull that lands sealed chunks from the
# cloud capture VM on the NAS, and a read-only metrics exporter over the report
# outputs. No venue credentials, no order interface, no trading, and raw market
# messages never reach pod logs.
#
# REQUIRED INPUTS before this syncs usefully:
#   1. image tags below must be a release produced by
#      .github/workflows/measurement-images.yml in paulkiernan/diff-logic-cells
#      (manual workflow_dispatch). Any private registry works: change the image
#      names here and in the workloads, or use `task measurement:images`.
#   2. the GHCR packages are PRIVATE and stay private (no public publication).
#      All five pod specs already reference the pull Secret:
#        imagePullSecrets:
#          - name: market-measurement-ghcr
#      The Secret itself is created only when credentials exist:
#        task measurement:ghcr-pull-secret \
#          GHCR_USER=<github username> GHCR_TOKEN=<token with read:packages>
#      which writes manifests/ghcr-pull-secret.sops.yaml and lists it in the
#      resources below by itself (idempotent; SOPS-encrypted per the
#      repository's secret convention). Until the Secret exists in this
#      namespace the pods stay in ImagePullBackOff — there is deliberately no
#      anonymous fallback and no placeholder Secret in git.
#   3. Secret market-measurement-pull-ssh, externally provisioned (SOPS) with
#      keys: id_ed25519, known_hosts, remote_host, remote_user, remote_port.
#      No remote path is stored: the forced command on the capture host already
#      roots rrsync at the spool, so the client asks for "/" and the CronJob
#      hardcodes it. The Secret is committed as
#      manifests/ssh-pull-secret.sops.yaml (encrypted); while it is missing the
#      pull CronJob fails visibly instead of skipping transport.
#
# Layout after a sync:
#   /var/lib/market-recorder  node-local spool, single writer, never on NFS
#   /archive                  NAS archive of sealed chunks (gzip + manifest)
#   /reports/<site>/          NAS report outputs (report.json + parquet)

resources:
  - ssh-pull-secret.sops.yaml
  - ghcr-pull-secret.sops.yaml
  - configmap.yaml
  - pvc.yaml
  - recorder-deployment.yaml
  - recorder-service.yaml
  - archive-deployment.yaml
  - reports-cronjob.yaml
  - ssh-pull-cronjob.yaml
  - scripts-configmap.yaml
  - servicemonitor.yaml
  - research-metrics-deployment.yaml
  - research-metrics-service.yaml
  - research-metrics-servicemonitor.yaml
  - networkpolicy.yaml

images:
  # Single place to pin the images. The market-research entry must be a
  # release whose package contains difflogic_hft.futures_metrics
  # (research-metrics-deployment.yaml): v0.2.0 (diff-logic-cells 847af2c) is
  # the first such release and is pinned by digest, so the report CronJob, the
  # SSH pull and the exporter all run the same verified bytes. The recorder
  # image and pods are not tied to the research release; repin entries
  # individually, since `task measurement:images VERSION=...` rewrites every
  # image in this block.
  - name: ghcr.io/paulkiernan/diff-logic-cells/market-recorder
    newTag: v0.1.0
  - name: ghcr.io/paulkiernan/diff-logic-cells/market-research
    newTag: v0.2.0
    digest: sha256:a2d355c0af8a6c5a12985a254e4e6caac7e6ef29d004922319945f8ffa6f9014
