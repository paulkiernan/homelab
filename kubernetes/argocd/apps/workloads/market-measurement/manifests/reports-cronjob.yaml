---
# Daily deterministic report over the verified NAS archive, one output
# directory per configured site. Batch only: no network, no venue access, no
# orders. The job verifies every sealed chunk's SHA256 against its manifest
# before the report runs, so the ledger can never consume a truncated or
# modified chunk.
#
# Outputs land in /reports/<site>/ (report.json, liquidity.parquet,
# funding.parquet, ledger.parquet) on the NAS.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-reports
  namespace: market-measurement
  labels:
    app.kubernetes.io/name: market-research
    app.kubernetes.io/part-of: market-measurement
spec:
  # 03:23 UTC daily, a few minutes after the hourly rotation boundary so a
  # fresh chunk and its manifest exist.
  schedule: "23 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # ttlSecondsAfterFinished belongs to the Job spec, not the CronJob spec:
      # the CronJob field is invalid and kubeconform rejects it.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 1
      # 18h, sized from a measured run rather than guessed. The old 7200 (2h)
      # had been exceeded every night since 2026-09-25, so no report was
      # published for ~18 days and the CronJob kept the app Degraded.
      #
      # Measured on 2026-10-13 against the live archive (1,243 sealed chunks),
      # on an arm64 worker, with output unbuffered so the phases were visible:
      #   verify-archive.sh ........... 3m07s
      #   futures_report homelab ...... 5h30m38s (0.8 core avg, 95Mi peak)
      #   futures_report aws-us-east-1  >26m (cut off by the probe's own limit)
      # Both sites are one continuous run since 2026-09-17 of the same shape
      # (~625 hourly chunks, ~5.1 GB each), so aws-us-east-1 costs the same as
      # homelab. The last success, 2026-09-25 at ~190 chunks per site,
      # finished homelab in ~1h55m, so runtime grows roughly linearly with the
      # archive: about +12 min per site per day of capture. It is CPU-bound on
      # one core per site with tiny memory, so more memory does not help.
      #
      # report.sh runs the sites CONCURRENTLY (see scripts-configmap.yaml), so
      # the job takes as long as one site, not the sum. That is what makes the
      # runway below real: run sequentially, tonight's job would already be
      # ~11h growing ~24 min/day, and 18h would last only ~2.5 weeks.
      #
      # Since market-research v0.3.0 the report is incremental (report.sh passes
      # --state-dir): a normal night replays only the new day plus one chunk,
      # ~15 min per site on these workers, which also keeps the `capture end
      # older than 28h` rule quiet (it needs a runtime under ~3h).
      #
      # The 18h stays, deliberately, for the other kind of night: every release
      # changes the package hash and forces one full replay to re-seed the
      # checkpoint, which costs what a whole night cost before (5h30m per site
      # in October 2026, +12 min/day, sites in parallel). 18h lets that finish
      # in one night until about mid-December. After that a re-seed simply
      # spans nights — the report commits a checkpoint every 24 chunks, so a
      # run stopped by this deadline resumes where it stopped — at the price
      # of one DeadlineExceeded job (and KubeJobFailed) per extra night.
      activeDeadlineSeconds: 64800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-research
            app.kubernetes.io/part-of: market-measurement
        spec:
          restartPolicy: OnFailure
          # Batch job: local volumes only, no Kubernetes API, no SA token.
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Private GHCR package: the Secret is created by
          # `task measurement:ghcr-pull-secret` (see kustomization.yaml).
          imagePullSecrets:
            - name: market-measurement-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The NAS subdirectory is created by the provisioner as root.
            - name: reports-permissions
              image: busybox:1.37
              command:
                - sh
                - -c
                - chown 65532:65532 /reports
              securityContext:
                # See recorder-deployment.yaml: CAP_CHOWN is required to take
                # ownership of the provisioner-created NFS directory; the
                # pod-level runAsNonRoot is overridden for this init step only.
                runAsNonRoot: false
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - FOWNER
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
          containers:
            - name: report
              image: ghcr.io/paulkiernan/diff-logic-cells/market-research:v0.1.0
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/report.sh
              env:
                - name: MSR_SITES
                  valueFrom:
                    configMapKeyRef:
                      name: market-measurement-config
                      key: sites
                - name: MSR_CONFIG
                  value: /etc/market-measurement/futures-study.json
                - name: MSR_TRADES
                  value: /etc/market-measurement/planned-trades.json
                - name: MSR_ARCHIVE
                  value: /archive
                - name: MSR_REPORTS
                  value: /reports
                # Without this the Python output is block-buffered (stdout is a
                # pipe, not a TTY), so a run that is killed by the deadline
                # flushes nothing and the logs cannot show which phase was
                # running. That is exactly why the 2h overrun went undiagnosed.
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                # DuckDB stages in bounded batches with a 512MB engine limit.
                # The 967,680-row synthetic grid peaked at 1.04GiB RSS; allow
                # headroom here. No CPU limit on the full-archive batch scan.
                #
                # Measured on the real archive 2026-10-13: 0.8 core average and
                # 95Mi peak working set for one site over 6h. report.sh now runs
                # one process per site concurrently, so the request is one core
                # per configured site (two today) and the 2Gi limit still covers
                # both with the synthetic-grid peak in reserve.
                requests:
                  cpu: "2"
                  memory: 1Gi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: study
                  mountPath: /etc/market-measurement
                  readOnly: true
                - name: archive
                  mountPath: /archive
                  readOnly: true
                - name: reports
                  mountPath: /reports
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: market-measurement-scripts
                defaultMode: 0555
            - name: study
              configMap:
                name: market-measurement-config
                defaultMode: 0444
                items:
                  - key: futures-study.json
                    path: futures-study.json
                  - key: planned-trades.json
                    path: planned-trades.json
            - name: archive
              persistentVolumeClaim:
                claimName: market-archive
            - name: reports
              persistentVolumeClaim:
                claimName: market-reports
            - name: tmp
              emptyDir:
                sizeLimit: 8Gi
