---
# Daily deterministic report over the verified NAS archive, one output
# directory per configured site. Batch only: no network, no venue access, no
# orders. The job verifies every sealed chunk's SHA256 against its manifest
# before the report runs, so the ledger can never consume a truncated or
# modified chunk.
#
# Outputs land in /reports/<site>/ (report.json, liquidity.parquet,
# funding.parquet, ledger.parquet) on the NAS.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-reports
  namespace: market-measurement
  labels:
    app.kubernetes.io/name: market-research
    app.kubernetes.io/part-of: market-measurement
spec:
  # 03:23 UTC daily, a few minutes after the hourly rotation boundary so a
  # fresh chunk and its manifest exist.
  schedule: "23 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # ttlSecondsAfterFinished belongs to the Job spec, not the CronJob spec:
      # the CronJob field is invalid and kubeconform rejects it.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 1
      # 18h, sized from a measured run rather than guessed. The old 7200 (2h)
      # had been exceeded every night since 2026-09-25, so no report was
      # published for ~18 days and the CronJob kept the app Degraded.
      #
      # Measured on 2026-10-13 against the live archive (1,243 sealed chunks),
      # on an arm64 worker, with output unbuffered so the phases were visible:
      #   verify-archive.sh ........... 3m07s
      #   futures_report homelab ...... 5h30m38s (one core, ~40Mi RSS)
      #   futures_report aws-us-east-1  >26m (cut off by the probe's own limit)
      # The last success, 2026-09-25 at ~379 chunks, finished in ~1h55m, so
      # runtime grows roughly linearly with the archive: about +12 min per day
      # of capture. It is CPU-bound on a single core with tiny memory, so more
      # memory or a CPU limit change does not help.
      #
      # This is a STOPGAP. futures_report recomputes the whole history every
      # night, so any fixed deadline eventually expires: 18h is roughly two
      # months of runway at the measured growth. It also cannot satisfy the
      # `capture end older than 28h` freshness rule, which implicitly assumes a
      # runtime under ~3h (capture end is ~24h + runtime + pull lag old just
      # before the next report lands), so expect that rule to fire for a couple
      # of hours each day until futures_report is made incremental upstream in
      # paulkiernan/diff-logic-cells. Shrink this again once it is.
      activeDeadlineSeconds: 64800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-research
            app.kubernetes.io/part-of: market-measurement
        spec:
          restartPolicy: OnFailure
          # Batch job: local volumes only, no Kubernetes API, no SA token.
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Private GHCR package: the Secret is created by
          # `task measurement:ghcr-pull-secret` (see kustomization.yaml).
          imagePullSecrets:
            - name: market-measurement-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The NAS subdirectory is created by the provisioner as root.
            - name: reports-permissions
              image: busybox:1.37
              command:
                - sh
                - -c
                - chown 65532:65532 /reports
              securityContext:
                # See recorder-deployment.yaml: CAP_CHOWN is required to take
                # ownership of the provisioner-created NFS directory; the
                # pod-level runAsNonRoot is overridden for this init step only.
                runAsNonRoot: false
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                    - FOWNER
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
          containers:
            - name: report
              image: ghcr.io/paulkiernan/diff-logic-cells/market-research:v0.1.0
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/report.sh
              env:
                - name: MSR_SITES
                  valueFrom:
                    configMapKeyRef:
                      name: market-measurement-config
                      key: sites
                - name: MSR_CONFIG
                  value: /etc/market-measurement/futures-study.json
                - name: MSR_TRADES
                  value: /etc/market-measurement/planned-trades.json
                - name: MSR_ARCHIVE
                  value: /archive
                - name: MSR_REPORTS
                  value: /reports
                # Without this the Python output is block-buffered (stdout is a
                # pipe, not a TTY), so a run that is killed by the deadline
                # flushes nothing and the logs cannot show which phase was
                # running. That is exactly why the 2h overrun went undiagnosed.
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                # DuckDB stages in bounded batches with a 512MB engine limit.
                # The 967,680-row synthetic grid peaked at 1.04GiB RSS; allow
                # headroom here. No CPU limit on the full-archive batch scan.
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: study
                  mountPath: /etc/market-measurement
                  readOnly: true
                - name: archive
                  mountPath: /archive
                  readOnly: true
                - name: reports
                  mountPath: /reports
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: market-measurement-scripts
                defaultMode: 0555
            - name: study
              configMap:
                name: market-measurement-config
                defaultMode: 0444
                items:
                  - key: futures-study.json
                    path: futures-study.json
                  - key: planned-trades.json
                    path: planned-trades.json
            - name: archive
              persistentVolumeClaim:
                claimName: market-archive
            - name: reports
              persistentVolumeClaim:
                claimName: market-reports
            - name: tmp
              emptyDir:
                sizeLimit: 8Gi
