---
# DRIFT's own Postgres. The shared postgres-homelab cluster runs pgvecto.rs (extension `vectors`),
# while DRIFT's ledger is written for pgvector (`vector`); the CNPG `standard` image ships pgvector.
# The app secret `drift-db-app` (uri/user/password) is generated by the operator.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: drift-db
  namespace: drift
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  storage:
    storageClass: nas-nfs
    size: 10Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  bootstrap:
    initdb:
      database: drift
      owner: drift
      # Extensions need a superuser; the server's migration then finds them present.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
