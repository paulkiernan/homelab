---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dungeon-revealer-tailscale
  namespace: dungeon-revealer
  annotations:
    tailscale.com/hostname: "vtt"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: dungeon-revealer
      port:
        number: 80
  tls:
    - hosts:
        - vtt
