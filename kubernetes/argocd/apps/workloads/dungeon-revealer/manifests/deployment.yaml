---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dungeon-revealer
  namespace: dungeon-revealer
  labels:
    app: dungeon-revealer
spec:
  # Maps and fog state live as flat files on one volume; never run two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dungeon-revealer
  template:
    metadata:
      labels:
        app: dungeon-revealer
    spec:
      containers:
        - name: dungeon-revealer
          image: dungeonrevealer/dungeon-revealer:v1.17.1
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            # An unset password leaves that view open to anyone.
            - name: DM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dungeon-revealer-secrets
                  key: DM_PASSWORD
            - name: PC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dungeon-revealer-secrets
                  key: PC_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /usr/src/app/data
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dungeon-revealer-data
