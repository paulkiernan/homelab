---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexispaul
  namespace: alexispaul
  labels:
    app: alexispaul
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: alexispaul
  template:
    metadata:
      labels:
        app: alexispaul
    spec:
      # Prefer one pod per node. Kept soft so rolling updates and node
      # maintenance never strand a replica in Pending on this small cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: alexispaul
      containers:
        - name: alexispaul
          image: ghcr.io/paulkiernan/alexispaul:0.25.32
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          envFrom:
            - secretRef:
                name: alexispaul-auth
          env:
            - name: NODE_ENV
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alexispaul-auth
                  key: POSTGRES_PASSWORD
            # The ClusterIP `db` Service from postgres.yaml.
            - name: DATABASE_URL
              value: postgres://wedding:$(POSTGRES_PASSWORD)@db:5432/wedding
            # PostHog. The app serves this key to the browser (GET
            # /api/analytics), which is what a phc_ project key is for: it can
            # only write events, never read them. It is deliberately not in the
            # SopsSecret, because encrypting a value that ships to every
            # visitor buys nothing. Unset both to turn analytics off without a
            # rebuild; the browser then never loads posthog-js at all.
            - name: POSTHOG_KEY
              value: phc_wyFs7Qespzu8mGwHQqzaEoqeePvUNgYgfgkbLVs8cCYh
            - name: POSTHOG_HOST
              value: https://us.i.posthog.com
      imagePullSecrets:
        - name: dockerconfigjson-github-com
