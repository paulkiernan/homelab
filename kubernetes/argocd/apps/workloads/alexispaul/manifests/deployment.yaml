---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alexispaul
  namespace: alexispaul
  labels:
    app: alexispaul
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: alexispaul
  template:
    metadata:
      labels:
        app: alexispaul
    spec:
      containers:
        - name: alexispaul
          image: ghcr.io/paulkiernan/alexispaul:0.16.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          envFrom:
            - secretRef:
                name: alexispaul-auth
          env:
            - name: NODE_ENV
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alexispaul-auth
                  key: POSTGRES_PASSWORD
            # The ClusterIP `db` Service from postgres.yaml.
            - name: DATABASE_URL
              value: postgres://wedding:$(POSTGRES_PASSWORD)@db:5432/wedding
      imagePullSecrets:
        - name: dockerconfigjson-github-com
