---
# Prowlarr. Indexers: holds the private-tracker logins in one place and syncs them
# to Radarr and Sonarr, so they can search and follow the trackers' RSS.
#
# Settings live in Postgres (prowlarr-main / prowlarr-log on postgres-homelab), not in
# SQLite on the NAS: the arrs are write-heavy, and SQLite over NFS is the
# usual way their databases get corrupted. pg_dumpall backs them up nightly.
# config.xml is overridden from the environment (PROWLARR__<SECTION>__<KEY>), so
# the API key and database login come from arr-secrets. media-glue applies the
# rest (UI login, root folder, download client, naming) through the API.
#
# UI: https://prowlarr.border-enigmatic.ts.net (tailnet only).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
  labels:
    app: prowlarr
spec:
  # config.xml, logs, the poster cache and the app's own weekly backups. The
  # database is in Postgres.
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels:
    app: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Same as qBittorrent: leader-01 is kept for Jellyfin and the
                  # control plane, and worker-04 has 4 GB.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-leader-01
                      - k8s-worker-04
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:3.1.0
          imagePullPolicy: IfNotPresent
          env:
            # Same ids the NAS squashes NFS clients to (see qbittorrent-deployment.yaml).
            - name: PUID
              value: "1024"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: TZ
              value: America/Los_Angeles
            - name: PROWLARR__POSTGRES__HOST
              value: postgres-homelab-rw.postgres.svc.cluster.local
            - name: PROWLARR__POSTGRES__PORT
              value: "5432"
            - name: PROWLARR__POSTGRES__USER
              value: prowlarr
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr-main
            - name: PROWLARR__POSTGRES__LOGDB
              value: prowlarr-log
            # A login is required for everyone. DisabledForLocalAddresses would
            # wave through the whole tailnet: the Tailscale proxy reaches the
            # app from a pod IP, which counts as local.
            - name: PROWLARR__AUTH__METHOD
              value: Forms
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
            - name: PROWLARR__LOG__ANALYTICSENABLED
              value: "False"
          envFrom:
            # PROWLARR__AUTH__APIKEY and PROWLARR__POSTGRES__PASSWORD
            - secretRef:
                name: prowlarr
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          # /ping needs no login. First boot creates the schema in Postgres,
          # so give startup room.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
  labels:
    app: prowlarr
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-tailscale
  namespace: media
  labels:
    app: prowlarr
  annotations:
    tailscale.com/hostname: "prowlarr"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: prowlarr
      port:
        number: 9696
  tls:
    - hosts:
        - prowlarr
