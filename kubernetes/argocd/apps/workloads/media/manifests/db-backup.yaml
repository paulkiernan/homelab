---
# Nightly snapshot of the media apps' own state to the NAS, kept for 14 days.
# It's named db-backup like every other app's, so the HomelabDatabaseBackupStale
# alert covers it.
#   <stamp>/qbittorrent/  qBittorrent.conf, categories.json, BT_backup/ (one
#                         .torrent and .fastresume per torrent), rss/
#   <stamp>/jellyfin/     config/*.xml (server, network, encoding settings),
#                         data/ with every SQLite database copied through the
#                         online backup API and integrity-checked, and plugins/
# Skipped as rebuildable: Jellyfin's metadata/, trickplay/ and keyframes/
# (images and thumbnails it regenerates from the media), and all logs.
# Radarr, Sonarr and Prowlarr live in Postgres, so the postgres namespace's
# pg_dumpall covers them.
#
# Runs on leader-01. jellyfin-config is a local volume there, and SQLite in WAL
# mode needs every process that opens the database on one host (they share the
# -shm index through mmap). The job runs as Jellyfin's user (1024:100) because
# even a read-only connection to a WAL database writes that -shm file.
#
# The backup volume is inline NFS rather than a PVC, so pruning this app can't
# delete its own backups.
#
# Restore:
#   qBittorrent: scale qbittorrent to 0, copy <stamp>/qbittorrent/ over
#     /config/qBittorrent in qbittorrent-config, scale back to 1.
#   Jellyfin: scale jellyfin to 0, copy <stamp>/jellyfin/ into jellyfin-config
#     (delete any *-wal/*-shm there first), scale back to 1. It rebuilds
#     images and thumbnails on its next scan.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: media
spec:
  schedule: "15 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k8s-leader-01
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsUser: 1024
            runAsGroup: 100
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: python:3.15.2-alpine3.24
              command: [python3, -I, -c]
              args:
                - |
                  import datetime, os, re, shutil, sqlite3, sys

                  OUT = "/backups"
                  # name: (source dir, a file that proves the volume is real, dirs to skip)
                  SOURCES = {
                      "qbittorrent": ("/sources/qbittorrent/qBittorrent", "qBittorrent.conf",
                                      {"logs"}),
                      "jellyfin": ("/sources/jellyfin", "config/system.xml",
                                   {"log", "metadata", "cache", "transcodes",
                                    "data/trickplay", "data/keyframes"}),
                  }
                  KEEP = datetime.timedelta(days=14)
                  SNAP = re.compile(r"\d{8}T\d{6}Z")
                  SKIP_FILE = re.compile(r"(-wal|-shm|-journal|\.seed-tmp)$")
                  MAGIC = b"SQLite format 3\x00"
                  UTC = datetime.timezone.utc

                  now = datetime.datetime.now(UTC)
                  name = now.strftime("%Y%m%dT%H%M%SZ")
                  tmp = os.path.join(OUT, name + ".tmp")
                  os.mkdir(tmp)

                  summary = []
                  for app, (src, must_have, skip) in SOURCES.items():
                      if not os.path.exists(os.path.join(src, must_have)):
                          sys.exit(f"{app}: no {must_have} under {src}; is the volume mounted?")
                      dbs, files, nbytes = [], 0, 0
                      for root, dirs, names in os.walk(src):
                          rel = os.path.relpath(root, src)
                          dirs[:] = [d for d in dirs
                                     if os.path.normpath(os.path.join(rel, d)) not in skip]
                          dest = os.path.join(tmp, app, rel)
                          os.makedirs(dest, exist_ok=True)
                          for f in names:
                              if SKIP_FILE.search(f):
                                  continue
                              s, d = os.path.join(root, f), os.path.join(dest, f)
                              try:
                                  with open(s, "rb") as fh:
                                      head = fh.read(16)
                              except FileNotFoundError:  # deleted mid-walk
                                  continue
                              if head == MAGIC:
                                  # A file copy of a live WAL database can be torn; the
                                  # backup API takes a consistent snapshot while the
                                  # server keeps writing.
                                  con = sqlite3.connect(s, timeout=30)
                                  out = sqlite3.connect(d, autocommit=True)
                                  con.backup(out)
                                  con.close()
                                  out.execute("PRAGMA journal_mode=DELETE")
                                  check = out.execute("PRAGMA integrity_check").fetchone()[0]
                                  out.close()
                                  if check != "ok":
                                      sys.exit(f"{app}: integrity_check failed on the copy of {rel}/{f}: {check}")
                                  dbs.append(os.path.normpath(os.path.join(rel, f)))
                              else:
                                  try:
                                      shutil.copy2(s, d)
                                  except FileNotFoundError:
                                      continue
                              files += 1
                              nbytes += os.path.getsize(d)
                      summary.append(f"{app}: {files} files ({len(dbs)} databases), {nbytes / 1e6:.1f} MB")
                  os.rename(tmp, os.path.join(OUT, name))

                  # Prune by snapshot name, not mtime (copy2 keeps source mtimes).
                  for d in os.listdir(OUT):
                      stamp = d.removesuffix(".tmp")
                      if d == name or not SNAP.fullmatch(stamp):
                          continue
                      age = now - datetime.datetime.strptime(stamp, "%Y%m%dT%H%M%SZ").replace(tzinfo=UTC)
                      if age > KEEP or (d != stamp and age > datetime.timedelta(hours=12)):
                          shutil.rmtree(os.path.join(OUT, d))
                          print(f"pruned {d}")

                  kept = sorted(d for d in os.listdir(OUT) if SNAP.fullmatch(d))
                  print(f"{name}: {'; '.join(summary)}; {len(kept)} snapshots kept")
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: qbittorrent-config
                  mountPath: /sources/qbittorrent
                  readOnly: true
                - name: jellyfin-config
                  mountPath: /sources/jellyfin
                - name: backups
                  mountPath: /backups
                  subPath: db-backups/media
          volumes:
            - name: qbittorrent-config
              persistentVolumeClaim:
                claimName: qbittorrent-config
            - name: jellyfin-config
              persistentVolumeClaim:
                claimName: jellyfin-config
            - name: backups
              nfs:
                server: 192.168.1.2
                path: /volume1/kubernetes-pvs
