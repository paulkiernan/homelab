---
# media-glue (glue/glue.py): applies glue/desired.json to Radarr, Sonarr and
# Prowlarr through their APIs every 10 min, and every 30 s adds the titles of
# torrents pasted into qBittorrent (category "movies" or "tv") to Radarr or
# Sonarr, so they import on their own. glue.py's docstring has the details.
# Its log is the place to look when a pasted torrent doesn't show up:
#   kubectl -n media logs deploy/media-glue
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-glue
  namespace: media
  labels:
    app: media-glue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media-glue
  template:
    metadata:
      labels:
        app: media-glue
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-glue
          image: python:3.15.2-alpine3.24
          command: [python3, -I, -u, /etc/media-glue/glue.py]
          env:
            - name: QBT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WEBUI_USERNAME
            - name: QBT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WEBUI_PASSWORD
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr
                  key: RADARR__AUTH__APIKEY
            - name: SONARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: sonarr
                  key: SONARR__AUTH__APIKEY
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr
                  key: PROWLARR__AUTH__APIKEY
            # Created in Jellyfin after its first-run setup. Until the secret
            # exists, the Jellyfin connection in Radarr/Sonarr is skipped.
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jellyfin-api
                  key: JELLYFIN_API_KEY
                  optional: true
          envFrom:
            # ARR_UI_USERNAME / ARR_UI_PASSWORD
            - secretRef:
                name: arr-ui-login
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: settings
              mountPath: /etc/media-glue
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: media-glue
