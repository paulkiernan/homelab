---
# The qBittorrent UI: https://torrents.border-enigmatic.ts.net, tailnet only.
# Radarr and Sonarr send it what they grab. To add a torrent by hand, pick
# category "movies" or "tv"; if the title isn't in Radarr/Sonarr yet, finish it
# there with Activity > Queue > Manual Import (it copies into the library).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-tailscale
  namespace: media
  labels:
    app: qbittorrent
  annotations:
    tailscale.com/hostname: "torrents"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: qbittorrent
      port:
        number: 8080
  tls:
    - hosts:
        - torrents
