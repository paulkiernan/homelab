---
# The media stack, in one namespace so every app can share the one claim on the
# NAS `media` share:
#   qBittorrent  downloads (Radarr/Sonarr send releases; you can also add one by hand)
#   Radarr/Sonarr  copy finished downloads into the library under clean names
#   Prowlarr     private-tracker indexers, synced into Radarr/Sonarr
#   Jellyfin     serves the library to Infuse on the Apple TV
#   arr-config   keeps the arrs' settings in git (applied through their APIs)
#
# Layout of that share (Radarr/Sonarr copy finished downloads into the
# library; media-share.yaml explains why it's still one share):
#   /volume1/media/movies, /volume1/media/tv   the library (Radarr/Sonarr/Jellyfin)
#   /volume1/media/torrents/{movies,tv}        qBittorrent downloads, by category
# Every pod mounts the share at /media, so a path means the same thing in every
# app (and in Finder) and no remote path mappings are needed. media-share.yaml
# has the details.
#
# Private. Every UI is tailnet-only (https://{torrents,radarr,sonarr,prowlarr,
# jellyfin}.border-enigmatic.ts.net). Jellyfin also has a LAN address for the
# Apple TV (192.168.1.235:8096). The only thing reachable from the internet is
# the BitTorrent peer port, through a port forward on the UniFi gateway to
# qbittorrent-peers (192.168.1.234).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - namespace.yaml
  - media-share.yaml
  - qbittorrent-secret.sops.yaml
  - qbittorrent-pvc.yaml
  - qbittorrent-deployment.yaml
  - qbittorrent-service.yaml
  - qbittorrent-tailscale-ingress.yaml
  - arr-secrets.sops.yaml
  - radarr.yaml
  - sonarr.yaml
  - prowlarr.yaml
  - jellyfin.yaml
  - jellyfin-secrets.sops.yaml
  - arr-config.yaml
  - db-backup.yaml

# The settings the cluster owns, applied through qBittorrent's Web API by the
# `configure` sidecar (see qbittorrent-deployment.yaml). The name hash rolls the
# pod whenever one of these files changes.
configMapGenerator:
  - name: qbittorrent-config
    files:
      - qbittorrent/preferences.json
      - qbittorrent/categories.json
      - qbittorrent/configure.py
      - qbittorrent/seed-credentials.py
  # arr-config's script and the arr settings it keeps in place.
  - name: arr-config
    files:
      - arr-config/reconcile.py
      - arr-config/desired.json
