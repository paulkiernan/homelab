---
# arr-config (arr-config/reconcile.py): keeps Radarr's, Sonarr's and Prowlarr's
# settings in git by applying arr-config/desired.json through their APIs every
# 10 minutes: UI login, root folders, the qBittorrent download client (copy,
# never hardlink), naming, the Jellyfin connection, and Prowlarr's sync to
# Radarr and Sonarr. It only writes what has drifted, so a quiet log is normal:
#   kubectl -n media logs deploy/arr-config
# If it's down or broken, the apps keep working with the settings they have.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-config
  namespace: media
  labels:
    app: arr-config
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arr-config
  template:
    metadata:
      labels:
        app: arr-config
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arr-config
          image: python:3.15.2-alpine3.24
          command: [python3, -I, -u, /etc/arr-config/reconcile.py]
          env:
            - name: QBT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WEBUI_USERNAME
            - name: QBT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WEBUI_PASSWORD
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr
                  key: RADARR__AUTH__APIKEY
            - name: SONARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: sonarr
                  key: SONARR__AUTH__APIKEY
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr
                  key: PROWLARR__AUTH__APIKEY
          envFrom:
            # ARR_UI_USERNAME / ARR_UI_PASSWORD
            - secretRef:
                name: arr-ui-login
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: settings
              mountPath: /etc/arr-config
              readOnly: true
            # JELLYFIN_API_KEY as a file, read on every pass. It was created in
            # Jellyfin after its first-run setup; until it exists, the Jellyfin
            # connection in Radarr/Sonarr is skipped.
            - name: jellyfin-api
              mountPath: /etc/arr-config-secrets
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: arr-config
        - name: jellyfin-api
          secret:
            secretName: jellyfin-api
            optional: true
