---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/immich-app/immich-charts
      chart: immich
      targetRevision: 0.13.4
      helm:
        # Chart 0.13.0 added a values.schema.json (a declared BREAKING CHANGE)
        # and this app picked it up as 0.13.1 on 2026-07-03. From that moment
        # `helm template` refused the values below, so ArgoCD could not render
        # or diff this app and stopped reconciling it entirely: its last
        # successful sync was chart 0.12.1 at commit ab920ba. It still reported
        # Healthy the whole time, because the running pods were fine — only the
        # repository had stopped being applied. Found 2026-10-13, which is why
        # the ArgoCD GitOps alerts in monitoring/local-monitoring now exist.
        #
        # The schema pins `immich` to exactly metrics / persistence /
        # configuration / configurationKind / existingConfiguration. Ingress is
        # not one of them: it belongs to each component as a bjw-s common value
        # set (`server.ingress.main`), and it defaults to disabled there.
        #
        # The removed `immich.ingress.enabled: false` had never done anything
        # even before the schema — 0.12.1 also had no such key, so it was
        # silently ignored rather than disabling anything. Nothing is needed in
        # its place: no component enables ingress here, and external access is
        # the Tailscale ingress in manifests/tailscale-ingress.yaml.
        valuesObject:
          immich:
            persistence:
              library:
                existingClaim: immich-library

          server:
            enabled: true
            # A top-level nodeSelector here was ignored by the chart. worker-04 has
            # half the memory of the other workers: on 2026-10-31 Immich filled it
            # during a large phone upload and took the node down. defaultPodOptions
            # is where the chart reads this, for server and machine-learning alike.
            defaultPodOptions:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: NotIn
                            values:
                              - k8s-worker-04
            controllers:
              main:
                containers:
                  main:
                    image:
                      tag: v3.3.5
                    resources:
                      requests:
                        cpu: 500m
                        memory: 1536Mi
                      limits:
                        cpu: 1500m
                        memory: 3Gi
                    # At its CPU limit during an upload the server cannot answer the
                    # default 1s probe, and the kubelet restarted it mid-job on
                    # 2026-11-01. 60s of tolerance rides out those stretches.
                    probes:
                      liveness:
                        spec:
                          timeoutSeconds: 5
                          failureThreshold: 6
                      readiness:
                        spec:
                          timeoutSeconds: 5
                          failureThreshold: 6
                      startup:
                        spec:
                          timeoutSeconds: 5
                    env:
                      DB_HOSTNAME:
                        value: postgres-homelab-rw.postgres.svc.cluster.local
                      DB_DATABASE_NAME:
                        value: immich
                      DB_USERNAME:
                        valueFrom:
                          secretKeyRef:
                            name: immich-db-user
                            key: username
                      DB_PASSWORD:
                        valueFrom:
                          secretKeyRef:
                            name: immich-db-user
                            key: password
                      REDIS_HOSTNAME: immich-valkey

          # `microservices` is deliberately gone. Immich folded that component
          # into the server upstream, and the chart has no such key: it is not
          # in values.yaml, not in the schema's properties and not referenced by
          # any template (only a stale mention in the chart's README). The block
          # here configured a component that does not exist — the cluster runs
          # server, machine-learning and valkey and nothing else — and the
          # schema tolerated it silently rather than rejecting it. Verified by
          # rendering 0.13.2 with and without it: the output is byte-identical.

          machine-learning:
            enabled: true
            # OpenVINO runs on the NUC's iGPU, the only one in the cluster; the
            # i915 driver comes from bootstrap/talos/schematics/nuc.yaml. This
            # also keeps it off worker-04, like the server above.
            defaultPodOptions:
              nodeSelector:
                kubernetes.io/hostname: k8s-leader-01
            controllers:
              main:
                containers:
                  main:
                    image:
                      tag: v3.3.5-openvino
                    # A hostPath alone leaves /dev/dri blocked by the device
                    # cgroup. Intel's GPU device plugin would remove this.
                    securityContext:
                      privileged: true
                    resources:
                      requests:
                        cpu: 500m
                        memory: 1Gi
                      limits:
                        cpu: 1000m
                        memory: 2500Mi
            persistence:
              dri:
                enabled: true
                type: hostPath
                hostPath: /dev/dri
                hostPathType: Directory
                globalMounts:
                  - path: /dev/dri
              cache:
                enabled: true
                size: 10Gi
                type: persistentVolumeClaim
                storageClass: nas-nfs
                accessMode: ReadWriteMany

          # Valkey is a bjw-s common component here, not the Bitnami chart, so
          # there is no `master` key and the `master.persistence` block that
          # used to sit here was dead config in the same way as the two above:
          # the schema allowed it and the chart ignored it. Valkey's `data`
          # volume is an emptyDir, confirmed both in the rendered output and on
          # the live Deployment, and has been for the 327 days it has run.
          #
          # Left ephemeral on purpose rather than quietly switched on. It holds
          # Immich's job queue and cache, which the server rebuilds after a
          # restart, and wiring real persistence would add a PVC and restart
          # valkey — a behaviour change that does not belong in the commit that
          # restores reconciliation. It is `valkey.persistence.data` if wanted.
          valkey:
            enabled: true

    - repoURL: https://github.com/paulkiernan/homelab
      targetRevision: main
      path: kubernetes/argocd/apps/workloads/immich/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: immich

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
