---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valheim
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/paulkiernan/homelab
    targetRevision: HEAD
    path: kubernetes/argocd/apps/workloads/valheim/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: valheim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
