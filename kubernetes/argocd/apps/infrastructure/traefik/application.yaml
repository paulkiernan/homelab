---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://helm.traefik.io/traefik
      targetRevision: 42.2.0
      chart: traefik
      helm:
        valuesObject:
          deployment:
            enabled: true
            kind: Deployment
            replicas: 2
          # Was `globalArguments: ["--global.checknewversion=false",
          # "--global.sendanonymoususage=false"]`. Chart 36.0.0 (2025-06-06)
          # replaced that list with this typed `global` block, following
          # upstream; chart 39.0.0 then set the schema's top-level
          # additionalProperties to false, which turned the leftover key from
          # silently ignored into a hard `helm template` failure. This app
          # picked up v39 on 2026-04-30, and ArgoCD has not been able to render
          # or diff it since — its last successful sync was chart 38.0.2 at
          # commit 9c9a8f5 (2026-01-08). It reported Healthy throughout, because
          # the running pods were fine; only the repository had stopped being
          # applied to the cluster's ingress controller.
          #
          # Note the window where it was accepted-but-ignored: between 36.0.0
          # and 39.0.0 these two settings did nothing at all, so the values here
          # are restoring the intent, not just renaming a key.
          # sendAnonymousUsage already defaults to false since 36.0.0's GDPR
          # change; it stays explicit because the intent is explicit.
          global:
            checkNewVersion: false
            sendAnonymousUsage: false
          ingressRoute:
            dashboard:
              enabled: false
          additionalArguments:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--entryPoints.web.forwardedHeaders.insecure=true"
            - "--entryPoints.websecure.forwardedHeaders.insecure=true"
          ports:
            web:
              port: 8000
              expose:
                default: true
              exposedPort: 80
              protocol: TCP
            websecure:
              port: 8443
              expose:
                default: true
              exposedPort: 443
              protocol: TCP
            traefik:
              port: 8080
              expose:
                default: true
              exposedPort: 8080
              protocol: TCP
          service:
            enabled: true
            type: LoadBalancer
          providers:
            kubernetesCRD:
              enabled: true
            kubernetesIngress:
              enabled: true
    - repoURL: https://github.com/paulkiernan/homelab
      targetRevision: main
      path: kubernetes/argocd/apps/infrastructure/traefik/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
