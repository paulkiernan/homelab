---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-gpu-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/paulkiernan/homelab
    targetRevision: HEAD
    path: kubernetes/argocd/apps/infrastructure/intel-gpu-plugin/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: intel-gpu-plugin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
