---
# DSM on the Synology NAS, which is outside the cluster. Port 443 on the Service
# is what makes the Tailscale proxy use TLS to the backend, so the DSM login does
# not cross the LAN in the clear. DSM's self-signed certificate is not verified.
apiVersion: v1
kind: Service
metadata:
  name: nas
  namespace: tailscale
spec:
  ports:
    - name: https
      port: 443
      targetPort: 5001
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas-1
  namespace: tailscale
  labels:
    kubernetes.io/service-name: nas
    endpointslice.kubernetes.io/managed-by: homelab
addressType: IPv4
ports:
  - name: https
    port: 5001
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.2
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nas-tailscale
  namespace: tailscale
  annotations:
    tailscale.com/hostname: "nas"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: nas
      port:
        number: 443
  tls:
    - hosts:
        - nas
