---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-oled
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/paulkiernan/homelab
    targetRevision: HEAD
    path: kubernetes/argocd/apps/infrastructure/node-oled/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: node-oled
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
