---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: node-oled
resources:
  - namespace.yaml
  - daemonset.yaml

# The script is mounted from a ConfigMap; the name hash rolls the DaemonSet
# whenever oled.py changes.
configMapGenerator:
  - name: node-oled-script
    files:
      - oled.py
