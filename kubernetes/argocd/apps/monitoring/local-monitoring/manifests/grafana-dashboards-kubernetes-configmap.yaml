  overview.json: "{\n  \"annotations\": {\n    \"list\": []\n  },\n  \"description\": \"A comprehensive overview dashboard for OpenCost that displays cluster-wide cost metrics including hourly and monthly costs broken down by resource type (CPU, RAM, PV, GPU), instance type, namespace, and individual nodes. Use this dashboard to monitor overall infrastructure spending, identify cost trends, and detect cost anomalies across your Kubernetes cluster. The dashboards were generated using [opencost-mixin](https://github.com/adinhodovic/opencost-mixin). Open issues and create feature requests in the repository.\",\n  \"editable\": false,\n  \"links\": [\n    {\n      \"asDropdown\": true,\n      \"includeVars\": false,\n      \"keepTime\": true,\n      \"tags\": [\n        \"opencost\",\n        \"opencost-mixin\"\n      ],\n      \"targetBlank\": true,\n      \"title\": \"OpenCost\",\n      \"type\": \"dashboards\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"id\": 1,\n      \"title\": \"Cluster Summary\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"$datasource\"\n      },\n      \"description\": \"Current hourly infrastructure cost rate across the cluster. This metric provides real-time cost visibility and can be used to project daily and monthly spending. The percentage change helps track cost fluctuations over time.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"decimals\": 2,\n          \"mappings\": [],\n          \"thresholds\": {\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": 0\n              }\n            ]\n          },\n          \"unit\": \"currencyUSD\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 3,\n        \"w\": 4,\n        \"x\": 0,\n        \"y\": 1\n      },\n      \"id\": 2,\n      \"options\": {\n        \"graphMode\": \"none\",\n        \"percentChangeColorMode\": \"inverted\",\n        \"showPercentChange\": true\n      },\n      \"pluginVersion\": \"v11.4.0\",\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"$datasource\"\n          },\n          \"expr\": \"sum(\\n  node_total_hourly_cost{\\n    cluster=\\\"$cluster\\\",\\njob=\\\"$opencost_job\\\"\\n\\n  }\\n)\\n+\\nsum(\\n  sum(\\n    kube_persistentvolume_capacity_bytes{\\n      cluster=\\\"$cluster\\\",\\njob=\\\"$ksm_job\\\"\\n\\n    } / (1024 * 1024 * 1024)\\n  ) by (persistentvolume)\\n  * on(persistentvolume) group_left()\\n  sum(\\n    pv_hourly_cost{\\n      cluster=\\\"$cluster\\\",\\njob=\\\"$opencost_job\\\"\\n\\n    }\\n  ) by (persistentvolume)\\n)\\n\",\n          \"instant\": false\n        }\n      ],\n      \"title\": \"Hourly Cost\",\n      \"type\": \"stat\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"$datasource\"\n      },\n      \"description\": \"Projected monthly infrastructure cost based on current hourly rates (730 hours per month). This projection helps with budget planning and cost forecasting. Compare this value against your budget to ensure spending stays within limits.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"decimals\": 2,\n          \"mappings\": [],\n          \"thresholds\": {\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": 0\n              }\n            ]\n          },\n          \"unit\": \"currencyUSD\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 3,\n        \"w\": 4,\n        \"x\": 4,\n        \"y\": 1\n      },\n      \"id\": 3,\n      \"options\": {\n        \"graphMode\": \"none\",\n        \"percentChangeColorMode\": \"invert