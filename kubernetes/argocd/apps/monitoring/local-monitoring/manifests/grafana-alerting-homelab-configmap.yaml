# Generated by generate-assets.py from the hand-authored files in alerts/ — do not edit by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-monitoring-grafana-alerting-homelab
  labels:
    grafana_alert: '1'
data:
  argocd-gitops-rules.yaml: "apiVersion: 1\ngroups:\n- orgId: 1\n  name: argocd-gitops\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: HomelabArgoCDAppManifestError\n    title: HomelabArgoCDAppManifestError\n    condition: C\n    for: 1h\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-argocd-gitops\n      __panelId__: '8'\n      summary: ArgoCD cannot render or compare application {{ $labels.name }}.\n      description: 'Application {{ $labels.name }} (project {{ $labels.project }}, destination namespace {{ $labels.dest_namespace }}) has had sync_status=Unknown for an hour: ArgoCD cannot generate its manifests, so it cannot diff them and has stopped reconciling it entirely. Auto-sync and self-heal do nothing in this state and the running workload may still look Healthy, so commits to this app are silently not being applied. Run `kubectl get application -n argocd {{ $labels.name }} -o jsonpath=''{.status.conditions}''` for the ComparisonError text; a Helm values schema rejection after a chart bump is the common cause.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'argocd_app_info{job=\"argocd-metrics\", sync_status=\"Unknown\"} == 1\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabArgoCDAppDegraded\n    title: HomelabArgoCDAppDegraded\n    condition: C\n    for: 30m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-argocd-gitops\n      __panelId__: '7'\n      summary: ArgoCD application {{ $labels.name }} is Degraded.\n      description: 'Application {{ $labels.name }} has been Degraded for 30 minutes: at least one resource it owns is failing its health check. Run `kubectl get application -n argocd {{ $labels.name }} -o json | jq ''.status.resources[] | select(.health.status != null and .health.status != \"Healthy\")''` to see which one.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'argocd_app_info{job=\"argocd-metrics\", health_status=\"Degraded\"} == 1\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabArgoCDAppOutOfSync\n    title: HomelabArgoCDAppOutOfSync\n    condition: C\n    for: 1h\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-argocd-gitops\n      __panelId__: '8'\n      summary: ArgoCD application {{ $labels.name }} has auto-sync on but has not converged.\n      description: Application {{ $labels.name }} has been OutOfSync for an hour with auto-sync enabled. ArgoCD has seen the difference and is failing to apply it, so the cluster is running something other than what the repository says. Check `kubectl get application -n argocd {{ $labels.name }} -o\
    \ jsonpath='{.status.operationState}'` for the sync error.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'argocd_app_info{job=\"argocd-metrics\", sync_status=\"OutOfSync\", autosync_enabled=\"true\"} == 1\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabArgoCDAppMissing\n    title: HomelabArgoCDAppMissing\n    condition: C\n    for: 30m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-argocd-gitops\n      __panelId__: '7'\n      summary: ArgoCD application {{ $labels.name }} has resources missing from the cluster.\n      description: 'Application {{ $labels.name }} has been Missing for 30 minutes: resources it declares do not exist in the cluster. Either its first sync never completed or something deleted them outside ArgoCD.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'argocd_app_info{job=\"argocd-metrics\", health_status=\"Missing\"} == 1\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabArgoCDAppStuckProgressing\n    title: HomelabArgoCDAppStuckProgressing\n    condition: C\n    for: 6h\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-argocd-gitops\n      __panelId__: '7'\n      summary: ArgoCD application {{ $labels.name }} has been Progressing for 6 hours.\n      description: 'Application {{ $labels.name }} has been Progressing for 6 hours, which is far longer than any rollout in this cluster takes: something it owns cannot reach its desired state. A pod stuck Terminating on an unreachable node will do this, as will a Deployment that can never satisfy its readiness probe.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'argocd_app_info{job=\"argocd-metrics\", health_status=\"Progressing\"} == 1\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabArgoCDControllerDown\n    title: HomelabArgoCDControllerDown\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      __dashboardUid__: homelab-argocd-gitops\n      __panelId__: '11'\n      summary: ArgoCD application\
    \ controller is not being scraped.\n      description: 'The argocd-metrics target has been down or absent for 15 minutes, so every ArgoCD GitOps alert is now inert rather than quiet-because-healthy: manifest errors, Degraded apps and failed syncs would all go unreported. Check the argocd-application-controller pod, the argocd-metrics Service, and the ServiceMonitor in kubernetes/bootstrap/argocd/metrics-servicemonitor.yaml.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'absent(up{job=\"argocd-metrics\"}) or up{job=\"argocd-metrics\"} == 0\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabArgoCDClusterUnreachable\n    title: HomelabArgoCDClusterUnreachable\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      __dashboardUid__: homelab-argocd-gitops\n      __panelId__: '11'\n      summary: ArgoCD cannot reach the cluster API at {{ $labels.server }}.\n      description: ArgoCD has reported its connection to {{ $labels.server }} as failed for 15 minutes. No application can sync while this is true, and the per-application alerts will show whatever state was last cached rather than the current one.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'argocd_cluster_connection_status{job=\"argocd-metrics\"} == 0\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n"
  database-backups-rules.yaml: "apiVersion: 1\ngroups:\n- orgId: 1\n  name: homelab-database-backups\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: HomelabDatabaseBackupStale\n    title: HomelabDatabaseBackupStale\n    condition: C\n    for: 6h\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      summary: No database backup has succeeded in {{ $labels.namespace }} for 36 hours.\n      description: The db-backup CronJob in {{ $labels.namespace }} has no successful run in 36 hours, or has never succeeded. Run `kubectl get jobs -n {{ $labels.namespace }}` and read the logs of the latest failed job. Dumps are on the NAS under /volume1/kubernetes-pvs/db-backups.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"kube_cronjob_info{cronjob=\\\"db-backup\\\"}\\n  unless on (namespace, cronjob)\\n(time() - kube_cronjob_status_last_successful_time{cronjob=\\\"db-backup\\\"} < 129600)\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n"
  homelab-capacity-rules.yaml: "apiVersion: 1\ngroups:\n- orgId: 1\n  name: homelab-capacity\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: HomelabPodUnschedulable\n    title: HomelabPodUnschedulable\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '1'\n      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot be scheduled.\n      description: 'The scheduler has marked pod {{ $labels.namespace }}/{{ $labels.pod }} unschedulable and it has stayed that way for 15 minutes: no node has enough free resources, a matching node selector/taint, or both. Check the pod''s events for the binding failure reason.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'kube_pod_status_unschedulable{job=\"integrations/kubernetes/kube-state-metrics\"} == 1\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabNodeCPURequestsHigh-warn\n    title: HomelabNodeCPURequestsHigh (warning)\n    condition: C\n    for: 30m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '2'\n      summary: Node {{ $labels.node }} has over 80% of its allocatable CPU requested.\n      description: '{{ $labels.node }} is at {{ printf \"%.1f\" $values.A.Value }}% CPU requests against its allocatable CPU, sustained for 30 minutes. New pods needing non-trivial CPU are likely to stay Pending; look for workloads that grew or a node that is draining/holding capacity.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (sum by (node) (\\n    kube_pod_container_resource_requests{resource=\\\"cpu\\\"}\\n    * on (namespace,pod,cluster) group_left(node)\\n      (max by (namespace,pod,cluster,node) (kube_pod_info)\\n       * on (namespace,pod,cluster) group_left() (kube_pod_status_phase{phase=~\\\"Pending|Running\\\"} == 1))\\n  ) / sum by (node) (kube_node_status_allocatable{resource=\\\"cpu\\\"})) > 80\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabNodeCPURequestsHigh-crit\n    title: HomelabNodeCPURequestsHigh (critical)\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '2'\n      summary: Node {{ $labels.node }} has over 90% of its allocatable CPU requested.\n      description: '{{ $labels.node }} is at {{ printf \"%.1f\" $values.A.Value }}% CPU requests against its allocatable CPU. The node is saturated for scheduling purposes; pods that land on it will also contend for the CPU itself. Rebalance or add capacity.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n\
    \        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (sum by (node) (\\n    kube_pod_container_resource_requests{resource=\\\"cpu\\\"}\\n    * on (namespace,pod,cluster) group_left(node)\\n      (max by (namespace,pod,cluster,node) (kube_pod_info)\\n       * on (namespace,pod,cluster) group_left() (kube_pod_status_phase{phase=~\\\"Pending|Running\\\"} == 1))\\n  ) / sum by (node) (kube_node_status_allocatable{resource=\\\"cpu\\\"})) > 90\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabNodeMemoryRequestsHigh-warn\n    title: HomelabNodeMemoryRequestsHigh (warning)\n    condition: C\n    for: 30m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '3'\n      summary: Node {{ $labels.node }} has over 80% of its allocatable memory requested.\n      description: '{{ $labels.node }} is at {{ printf \"%.1f\" $values.A.Value }}% memory requests against its allocatable memory, sustained for 30 minutes. New pods that declare a memory request are likely to stay Pending. Note that actual memory use on this cluster runs well above requests, so check NodeMemoryHighUtilization as well before concluding there is headroom.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (sum by (node) (\\n    kube_pod_container_resource_requests{resource=\\\"memory\\\"}\\n    * on (namespace,pod,cluster) group_left(node)\\n      (max by (namespace,pod,cluster,node) (kube_pod_info)\\n       * on (namespace,pod,cluster) group_left() (kube_pod_status_phase{phase=~\\\"Pending|Running\\\"} == 1))\\n  ) / sum by (node) (kube_node_status_allocatable{resource=\\\"memory\\\"})) > 80\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabNodeMemoryRequestsHigh-crit\n    title: HomelabNodeMemoryRequestsHigh (critical)\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '3'\n      summary: Node {{ $labels.node }} has over 90% of its allocatable memory requested.\n      description: '{{ $labels.node }} is at {{ printf \"%.1f\" $values.A.Value }}% memory requests against its allocatable memory. Scheduling on this node will fail for anything that asks for a real request; rebalance workloads or add capacity.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (sum by (node) (\\n    kube_pod_container_resource_requests{resource=\\\"memory\\\"}\\n    * on (namespace,pod,cluster) group_left(node)\\n      (max by (namespace,pod,cluster,node) (kube_pod_info)\\n       * on (namespace,pod,cluster) group_left() (kube_pod_status_phase{phase=~\\\"Pending|Running\\\"} == 1))\\n  ) / sum\
    \ by (node) (kube_node_status_allocatable{resource=\\\"memory\\\"})) > 90\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabNodeDiskSpaceHigh-warn\n    title: HomelabNodeDiskSpaceHigh (warning)\n    condition: C\n    for: 30m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '4'\n      summary: '{{ $labels.instance }}:{{ $labels.mountpoint }} is over 75% full.'\n      description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ printf \"%.1f\" $values.A.Value }}% full (fstype {{ $labels.fstype }}). Node-local volume claims are not enforced on this cluster — openebs-hostpath serves them from this filesystem and reports the filesystem, not the claim — so a runaway volume (Prometheus TSDB, Loki chunks, the market capture spool) is the likely cause rather than a full claim. Free space or fix the volume before the filesystem itself fills.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (1 - node_filesystem_avail_bytes{job=\\\"integrations/node_exporter\\\",fstype=~\\\"xfs|ext4\\\",mountpoint!~\\\"/boot.*\\\"}\\n          / node_filesystem_size_bytes{job=\\\"integrations/node_exporter\\\",fstype=~\\\"xfs|ext4\\\",mountpoint!~\\\"/boot.*\\\"}) > 75\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabNodeDiskSpaceHigh-crit\n    title: HomelabNodeDiskSpaceHigh (critical)\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '4'\n      summary: '{{ $labels.instance }}:{{ $labels.mountpoint }} is over 90% full.'\n      description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ printf \"%.1f\" $values.A.Value }}% full (fstype {{ $labels.fstype }}). At this point writes to any hostpath volume on the node — Prometheus TSDB, Loki chunks, the capture spool, Grafana's DB — can fail. Free space now.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (1 - node_filesystem_avail_bytes{job=\\\"integrations/node_exporter\\\",fstype=~\\\"xfs|ext4\\\",mountpoint!~\\\"/boot.*\\\"}\\n          / node_filesystem_size_bytes{job=\\\"integrations/node_exporter\\\",fstype=~\\\"xfs|ext4\\\",mountpoint!~\\\"/boot.*\\\"}) > 90\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n      \
    \  type: math\n  - uid: HomelabPrometheusStorageHigh-warn\n    title: HomelabPrometheusStorageHigh (warning)\n    condition: C\n    for: 30m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '5'\n      summary: Prometheus TSDB is over 75% of its 20Gi claim.\n      description: 'Blocks plus WAL are {{ printf \"%.2f\" $values.A.Value }}% of the 20Gi claim, above the ~65% that the configured retentionSize: 14GB should enforce: retention is not holding. Prometheus is on a hostpath volume, so the claim does not bound it and the node''s /var (see HomelabNodeDiskSpaceHigh) is what fills next. Check series cardinality and the prometheus_tsdb_* metrics.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (prometheus_tsdb_storage_blocks_bytes{job=\\\"prometheus\\\"} + prometheus_tsdb_wal_storage_size_bytes{job=\\\"prometheus\\\"})\\n      / (20 * 1024 * 1024 * 1024) > 75\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: HomelabPrometheusStorageHigh-crit\n    title: HomelabPrometheusStorageHigh (critical)\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      __dashboardUid__: homelab-capacity\n      __panelId__: '5'\n      summary: Prometheus TSDB is over 90% of its 20Gi claim.\n      description: Blocks plus WAL are {{ printf \"%.2f\" $values.A.Value }}% of the 20Gi claim. Retention (60d, retentionSize 14GB) is manifestly not holding; the TSDB will start eating the node's /var and take the other hostpath volumes (Loki, Grafana, the capture spool) with it. Reduce retention now and investigate what grew.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"100 * (prometheus_tsdb_storage_blocks_bytes{job=\\\"prometheus\\\"} + prometheus_tsdb_wal_storage_size_bytes{job=\\\"prometheus\\\"})\\n      / (20 * 1024 * 1024 * 1024) > 90\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n"
