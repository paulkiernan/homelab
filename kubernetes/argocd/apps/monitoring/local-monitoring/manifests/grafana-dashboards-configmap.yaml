heus\",\n            \"uid\": \"market-prometheus\"\n          },\n          \"editorMode\": \"code\",\n          \"expr\": \"100 * node_filesystem_avail_bytes{job=\\\"market-capture-host\\\",fstype!~\\\"tmpfs|ramfs|overlay\\\"} / node_filesystem_size_bytes{job=\\\"market-capture-host\\\",fstype!~\\\"tmpfs|ramfs|overlay\\\"}\",\n          \"legendFormat\": \"{{instance}} {{mountpoint}}\",\n          \"range\": true,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Capture host disk free\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 20,\n        \"x\": 0,\n        \"y\": 18\n      },\n      \"id\": 7,\n      \"options\": {\n        \"content\": \"**Measurement only.** This system captures public market data and computes conditional, explicitly labelled paper scenarios. It holds no venue credentials, exposes no order interface, moves no capital, and does not claim to know real funding cashflows or fee schedules. Sealed chunks live in the recorder spool and are copied to the archive/ledger pipeline; raw messages are never written to logs or to Loki.\",\n        \"mode\": \"markdown\"\n      },\n      \"title\": \"Scope\",\n      \"type\": \"text\"\n    }\n  ],\n  \"refresh\": \"30s\",\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"market-measurement\",\n    \"futures\"\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"current\": {\n          \"selected\": true,\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        },\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"market-prometheus\"\n        },\n        \"definition\": \"label_values(market_recorder_connected, instance)\",\n        \"hide\": 0,\n        \"includeAll\": true,\n        \"label\": \"instance\",\n        \"multi\": true,\n        \"name\": \"instance\",\n        \"options\": [],\n        \"query\": {\n          \"query\": \"label_values(market_recorder_connected, instance)\",\n          \"refId\": \"StandardVariableQuery\"\n        },\n        \"refresh\"\
