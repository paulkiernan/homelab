_interval]))\",\n          \"legendFormat\": \"{{instance}} messages/s\",\n          \"range\": true,\n\
    \          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"market-prometheus\"\n          },\n          \"editorMode\": \"code\",\n          \"expr\": \"sum by (instance) (rate(market_recorder_application_bytes_total{instance=~\\\"$instance\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"{{instance}} application bytes/s\",\n          \"range\": true,\n          \"refId\": \"B\"\n        }\n      ],\n      \"title\": \"Throughput\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"market-prometheus\"\n      },\n      \"description\": \"Counters that must stay flat during healthy capture. Sequence gaps force a resnapshot; queue overflows mean records were dropped rather than written; errors include parse failures and rejected redirects.\",\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"axisCenteredZero\": false,\n            \"axisColorMode\": \"text\",\n            \"axisLabel\": \"\",\n            \"axisPlacement\": \"auto\",\n            \"drawStyle\": \"bars\",\n            \"fillOpacity\": 60,\n            \"lineWidth\": 1,\n            \"pointSize\": 5,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"group\": \"A\",\n              \"mode\": \"normal\"\n            }\n          },\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 10,\n        \"x\": 10,\n        \"y\": 4\n      },\n      \"id\": 6,\n      \"options\": {\n        \"legend\": {\n          \"calcs\": [\n            \"sum\"\n          ],\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\