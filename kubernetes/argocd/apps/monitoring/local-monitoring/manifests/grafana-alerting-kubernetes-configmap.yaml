labels.persistentvolume }} {{ with $labels.cluster -}} on Cluster {{ . }} {{- end }} has status {{ $labels.phase }}.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepersistentvolumeerrors\n      summary: PersistentVolume is having issues with provisioning.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'kube_persistentvolume_status_phase{phase=~\"Failed|Pending\",job=\"integrations/kubernetes/kube-state-metrics\"} > 0\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n- orgId: 1\n  name: kubernetes-system\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: KubeVersionMismatch\n    title: KubeVersionMismatch\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: There are {{ $values.A.Value }} different semantic versions of Kubernetes components running on cluster {{ $labels.cluster }}.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeversionmismatch\n      summary: Different semantic versions of Kubernetes components running.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'count by (cluster) (count by (git_version, cluster) (label_replace(kubernetes_build_info{job!~\"kube-dns|coredns\"},\"git_version\",\"$1\",\"git_version\"\
    ,\"(v[0-9]*.[0-9]*).*\"))) > 1\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n- orgId: 1\n  name: kubernetes-system-kubelet\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: KubeNodeNotReady\n    title: KubeNodeNotReady\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: '{{ $labels.node }} has been unready for more than 15 minutes on cluster {{ $labels.cluster }}.'\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodenotready\n      summary: Node is not ready.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'kube_node_status_condition{job=\"integrations/kubernetes/kube-state-metrics\",condition=\"Ready\",status=\"true\"} == 0\n\n          and on (cluster, node)\n\n          kube_node_spec_unschedulable{job=\"integrations/kubernetes/kube-state-metrics\"} == 0\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expre