me{job=\\\"integrations/kubernetes/kubelet\\\"}\\n  )\\n)\\n/ on (cluster, node) group_left()\\nmax by (cluster, node) (\\n  kube_node_status_capacity{job=\\\"integrations/kubernetes/kube-state-metrics\\\", resource=\\\"pods\\\"} != 1\\n) > 0.95\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: KubeNodeReadinessFlapping\n    title: KubeNodeReadinessFlapping\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: The readiness status of node {{ $labels.node }} has changed {{ $values.A.Value }} times in the last 15 minutes on cluster {{ $labels.cluster }}.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodereadinessflapping\n      summary: Node readiness status is flapping.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'sum(changes(kube_node_status_condition{job=\"integrations/kubernetes/kube-state-metrics\",status=\"true\",condition=\"Ready\"}[15m])) by (cluster, node) > 2\n\n          and on (cluster, node)\n\n          kube_node_spec_unschedulable{job=\"integrations/kubernetes/kube-state-metrics\"} == 0\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to:\
