n    annotations:\n      description: The PersistentVolume claimed by {{ $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} {{ with $labels.cluster -}} on Cluster {{ . }} {{- end }} only has {{ $values.A.Value | humanizePercentage }} free inodes.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepersistentvolumeinodesfillingup\n      summary: PersistentVolumeInodes are filling up.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"(\\n  kubelet_volume_stats_inodes_free{job=\\\"integrations/kubernetes/kubelet\\\"}\\n    /\\n  kubelet_volume_stats_inodes{job=\\\"integrations/kubernetes/kubelet\\\"}\\n) < 0.03\\nand\\nkubelet_volume_stats_inodes_used{job=\\\"integrations/kubernetes/kubelet\\\"} > 0\\nunless on(cluster, namespace, persistentvolumeclaim)\\nkube_persistentvolumeclaim_access_mode{ access_mode=\\\"ReadOnlyMany\\\"} == 1\\nunless on(cluster, namespace, persistentvolumeclaim)\\nkube_persistentvolumeclaim_labels{label_excluded_from_alerts=\\\"true\\\"} == 1\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: KubePersistentVolumeInodesFillingUp-warn\n    title: KubePersistentVolumeInodesFillingUp (warning)\n    condition: C\n    for: 1h\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: Based on recent sampling, the PersistentVolume claimed by {{ $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} {{ with\
