    \        editorMode: code\n        expr: 'increase(node_systemd_service_restart_total{job=\"integrations/node_exporter\"}[5m]) > 2\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: NodeBondingDegraded\n    title: NodeBondingDegraded\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: Bonding interface {{ $labels.master }} on {{ $labels.instance }} is in degraded state due to one or more slave failures.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodebondingdegraded\n      summary: Bonding interface is degraded.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: '(node_bonding_slaves{job=\"integrations/node_exporter\"} - node_bonding_active{job=\"integrations/node_exporter\"}) != 0\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n- orgId: 1\n  name: kube-state-metrics\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: KubeStateMetricsListErrors\n    title: KubeStateMetricsListErrors\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      description: kube-state-metrics is experiencing errors at an elevated rate in list operations. This is likely causing it to not be able to expose metrics about Kubernetes objects correctly or at all.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kube-state-metrics/kubestatemetricslisterrors\n      summary: kube-state-metrics is experiencing errors in list operations.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"(sum(rate(kube_state_metrics_list_total{job=\\\"integrations/kubernetes/kube-state-metrics\\\",result=\\\"error\\\"}[5m])) by (cluster)\\n  /\\nsum(rate(kube_state_metrics_list_total{job=\\\"integrations/kubernetes/kube-state-metrics\\\"}[5m])) by (cluster))\\n> 0.01\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: KubeStateMetricsWatchErrors\n    title: KubeStateMetricsWatchErrors\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      description: kube-state-metrics is experiencing errors at an elevated rate in watch operations. This is likely causing it to not be able to expose metrics about Kubernetes objects correctly or at all.\n\
    \      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kube-state-metrics/kubestatemetricswatcherrors\n      summary: kube-state-metrics is experiencing errors in watch operations.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"(sum(rate(kube_state_metrics_watch_total{job=\\\"integrations/kubernetes/kube-state-metrics\\\",result=\\\"error\\\"}[5m])) by (cluster)\\n  /\\nsum(rate(kube_state_metrics_watch_total{job=\\\"integrations/kubernetes/kube-state-metrics\\\"}[5m])) by (cluster))\\n> 0.01\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: KubeStateMetricsShardingMismatch\n    title: KubeStateMetricsShardingMismatch\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      description: kube-state-metrics pods are running with different --total-shards configuration, some Kubernetes objects may be exposed multiple times or not exposed at all.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kube-state-metrics/kubestatemetricsshardingmismatch\n      summary: kube-state-metrics sharding is misconfigured.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'stdvar (kube_state_metrics_total_shards{job=\"integrations/kubernetes/kube-state-metrics\"}) by (cluster) != 0\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: KubeStateMetricsShardsMissing\n    title: KubeStateMetricsShardsMissing\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: critical\n    annotations:\n      description: kube-state-metrics shards are missing, some Kubernetes objects are not being exposed.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kube-state-metrics/kubestatemetricsshardsmissing\n      summary: kube-state-metrics shards are missing.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"2^max(kube_state_metrics_total_shards{job=\\\"integrations/kubernetes/kube-state-metrics\\\"}) by (cluster) - 1\\n  -\\nsum( 2 ^ max by (cluster, shard_ordinal) (kube_state_metrics_shard_ordinal{job=\\\"integrations/kubernetes/kube-state-metrics\\\"}) ) by (cluster)\\n!= 0\\n\"\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n- orgId: 1\n\
    \  name: general.rules\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: TargetDown\n    title: TargetDown\n    condition: C\n    for: 10m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: '{{ printf \"%.4g\" $values.A.Value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} namespace are down.'\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/targetdown\n      summary: One or more targets are unreachable.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 100 * (count(up == 0) BY (cluster, job, namespace, service) / count(up) BY (cluster, job, namespace, service)) > 10\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n- orgId: 1\n  name: node-network\n  folder: Kubernetes\n  interval: 60s\n  rules:\n  - uid: NodeNetworkInterfaceFlapping\n    title: NodeNetworkInterfaceFlapping\n    condition: C\n    for: 2m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: Network interface \"{{ $labels.device }}\" changing its up status often on node-exporter {{ $labels.namespace }}/{{ $labels.pod }}\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/nodenetworkinterfaceflapping\n      summary: Network interface is often changing its status\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'changes(node_network_up{job=\"integrations/node_exporter\",device!~\"veth.+\"}[2m]) > 2\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n"
