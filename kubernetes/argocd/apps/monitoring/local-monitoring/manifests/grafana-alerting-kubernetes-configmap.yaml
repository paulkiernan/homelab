ion: The Kubelet Pod Lifecycle Event Generator has a 99th percentile duration of {{ $values.A.Value }} seconds on node {{ $labels.node }} on cluster {{ $labels.cluster }}.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeletplegdurationhigh\n      summary: Kubelet Pod Lifecycle Event Generator is taking too long to relist.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 'node_quantile:kubelet_pleg_relist_duration_seconds:histogram_quantile{quantile=\"0.99\"} >= 10\n\n          '\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n        datasource:\n          type: prometheus\n          uid: market-prometheus\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: is_number($A)\n        refId: C\n        type: math\n  - uid: KubeletPodStartUpLatencyHigh\n    title: KubeletPodStartUpLatencyHigh\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    isPaused: false\n    labels:\n      severity: warning\n    annotations:\n      description: Kubelet Pod startup 99th percentile latency is {{ $values.A.Value }} seconds on node {{ $labels.node }} on cluster {{ $labels.cluster }}.\n      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeletpodstartuplatencyhigh\n      summary: Kubelet Pod startup latency is too high.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: \"histogram_quantile(0.99,\\n  sum by (cluster, instance, le) (\\n    topk by (cluster, instance, le, operation_type) (1,\\n      rate(kubelet_pod_worker_duration_seconds_bucket{job=\\\
