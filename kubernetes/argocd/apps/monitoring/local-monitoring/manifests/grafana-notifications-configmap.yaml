---
# Where the provisioned alert rules go. Hand-maintained (not generated): the
# rules come from generate-assets.py (Kubernetes rules vendored from
# kube-prometheus, homelab rules from ../alerts/), the delivery target is a
# homelab decision.
#
# ONE Discord contact point, discord-cluster, at $DISCORD_CLUSTER_WEBHOOK_URL.
# The URL is a secret: Grafana expands the variable from the environment at
# provisioning time (envValueFrom in ../application.yaml reads it from the
# SOPS-managed Secret local-monitoring-grafana-alerting, key
# discord-cluster-webhook-url), so this file never contains a URL and the
# ConfigMap is safe to read.
#
# The root receiver is discord-cluster: it is the catch-all, so anything that
# matches no route below -- including Grafana's own DatasourceError/NoData
# alerts -- reaches the cluster channel (Grafana always has a root receiver).
# The severity=info route exists only to slow the repeat interval to 24h for
# the low-severity kube-prometheus alerts; it points at the same receiver as
# the root.
#
# tombstones.yaml deletes what an earlier revision provisioned and this one no
# longer does. Grafana's file provisioning only creates and updates (checked
# against v13.2.3): a rule or contact point that disappears from these files
# stays in Grafana's database, still evaluating and notifying, until a
# deleteRules/deleteContactPoints entry removes it. Both deletes are idempotent,
# so an entry is harmless once applied and safe to drop once Grafana no longer
# lists the uid. The key sorts after every rules file on purpose: Grafana
# applies the files in name order, so a rules file still mounted mid-sync
# cannot re-create what this deletes. Today it retires the 17 market
# measurement rules and their discord-market-measurement contact point (the
# experiment was shut down 2026-11-18).
#
# The grafana_alert label is what the chart's k8s-sidecar watches; each key
# becomes a file under /etc/grafana/provisioning/alerting and Grafana's
# provisioning reload is called on change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-monitoring-grafana-notifications
  labels:
    grafana_alert: "1"
data:
  notifications.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: homelab
        template: |
          {{ define "homelab.title" -}}
          {{ if eq .Status "firing" }}[FIRING{{ if .Alerts.Firing }} {{ len .Alerts.Firing }}{{ end }}]{{ else }}[RESOLVED]{{ end }}
          {{- with .GroupLabels.alertname }} {{ . }}{{ end }}
          {{- with .CommonLabels.severity }} ({{ . }}){{ end }}
          {{- end }}

          {{ define "homelab.scope" -}}
          {{ with .Labels.name }} `app={{ . }}`{{ end }}
          {{- with .Labels.node }} `node={{ . }}`{{ end }}
          {{- if not .Labels.node }}{{ with .Labels.instance }} `at={{ . }}`{{ end }}{{ end }}
          {{- with .Labels.namespace }} `ns={{ . }}`{{ end }}
          {{- with .Labels.pod }} `pod={{ . }}`{{ end }}
          {{- with .Labels.job_name }} `job={{ . }}`{{ end }}
          {{- with .Labels.daemonset }} `ds={{ . }}`{{ end }}
          {{- with .Labels.deployment }} `deploy={{ . }}`{{ end }}
          {{- with .Labels.statefulset }} `sts={{ . }}`{{ end }}
          {{- with .Labels.mountpoint }} `mount={{ . }}`{{ end }}
          {{- with .Labels.site }} `site={{ . }}`{{ end }}
          {{- if not .Labels.pod }}{{ if not .Labels.node }}{{ with .Labels.job }} `scrape={{ . }}`{{ end }}{{ end }}{{ end }}
          {{- end }}

          {{ define "homelab.detail" -}}
          **{{ .Labels.alertname }}**{{ with .Labels.severity }} · `{{ . }}`{{ end }}
          {{ with .Annotations.summary }}{{ . }}
          {{ end }}{{ with .Annotations.description }}> {{ . }}
          {{ end }}{{ with .Annotations.Error }}error: `{{ . }}`
          {{ end }}on:{{ template "homelab.scope" . }}
          since {{ .StartsAt.Format "Jan 02 15:04 MST" }}{{ with .PanelURL }} · [chart]({{ . }}){{ end }}

          {{ end }}

          {{ define "homelab.compact" -}}
          **{{ .Labels.alertname }}**{{ with .Labels.severity }} · `{{ . }}`{{ end }}
          {{ with .Annotations.summary }}{{ . }}
          {{ end }}on:{{ template "homelab.scope" . }}

          {{ end }}

          {{ define "homelab.brief" -}}
          - {{ .Labels.alertname }}{{ template "homelab.scope" . }}
          {{ end }}

          {{ define "homelab.message" -}}
          {{ if .Alerts.Firing }}**{{ len .Alerts.Firing }} firing**

          {{ if le (len .Alerts.Firing) 2 }}{{ range .Alerts.Firing }}{{ template "homelab.detail" . }}{{ end }}
          {{- else if le (len .Alerts.Firing) 6 }}{{ range .Alerts.Firing }}{{ template "homelab.compact" . }}{{ end }}
          {{- else }}{{ range slice .Alerts.Firing 0 6 }}{{ template "homelab.compact" . }}{{ end }}_showing 6 of {{ len .Alerts.Firing }} — open the dashboard for the rest_
          {{ end }}
          {{- end }}
          {{- if .Alerts.Resolved }}
          **{{ len .Alerts.Resolved }} resolved**
          {{ if gt (len .Alerts.Resolved) 6 }}{{ range slice .Alerts.Resolved 0 6 }}{{ template "homelab.brief" . }}{{ end }}_and more, {{ len .Alerts.Resolved }} in total_
          {{ else }}{{ range .Alerts.Resolved }}{{ template "homelab.brief" . }}{{ end }}{{ end }}
          {{- end }}
          {{- end }}
    contactPoints:
      - orgId: 1
        name: discord-cluster
        receivers:
          - uid: discord-cluster
            type: discord
            disableResolveMessage: false
            settings:
              url: $DISCORD_CLUSTER_WEBHOOK_URL
              use_discord_username: true
              # Render the message as the embed description so it sits with the
              # panel screenshots Grafana attaches as sibling embeds. The 2000
              # rune cap applies either way (the notifier truncates before this
              # branch), and no template uses @mentions, which are the one thing
              # that stops working from an embed.
              use_embed_description: true
              title: '{{ template "homelab.title" . }}'
              message: '{{ template "homelab.message" . }}'
    policies:
      - orgId: 1
        receiver: discord-cluster
        group_by:
          - grafana_folder
          - alertname
          - site
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: discord-cluster
            object_matchers:
              - [severity, "=", "info"]
            repeat_interval: 24h
  tombstones.yaml: |
    apiVersion: 1
    deleteRules:
      # market-measurement-capture (retired 2026-11-18)
      - orgId: 1
        uid: market-recorder-capture-disconnected
      - orgId: 1
        uid: market-recorder-feed-stale
      - orgId: 1
        uid: market-recorder-no-durable-writes
      - orgId: 1
        uid: market-recorder-queue-overflow
      - orgId: 1
        uid: market-recorder-sequence-gaps
      - orgId: 1
        uid: market-recorder-reconnect-churn
      - orgId: 1
        uid: market-recorder-errors
      - orgId: 1
        uid: market-capture-host-disk-low
      - orgId: 1
        uid: market-recorder-scrape-target-down
      - orgId: 1
        uid: recorder-site-absent-homelab
      - orgId: 1
        uid: recorder-site-absent-aws-us-east-1
      # market-research-report-freshness (retired 2026-11-18)
      - orgId: 1
        uid: research-report-missing-homelab
      - orgId: 1
        uid: research-report-missing-aws-us-east-1
      - orgId: 1
        uid: research-report-stale-homelab
      - orgId: 1
        uid: research-report-stale-aws-us-east-1
      - orgId: 1
        uid: research-capture-stale-homelab
      - orgId: 1
        uid: research-capture-stale-aws-us-east-1
    deleteContactPoints:
      # Unprovisioned after the policy above is replaced, so the route that
      # referenced it is already gone when Grafana deletes it.
      - orgId: 1
        uid: discord-market-measurement
