---
# Where the provisioned alert rules go. Hand-maintained (not generated): the
# rules come from generate-assets.py (market assets from diff-logic-cells,
# Kubernetes rules vendored from kube-prometheus), the delivery target is a
# homelab decision.
#
# TWO Discord contact points, one per audience, so cluster noise and
# market-measurement alerts land in different channels:
#   - discord-market-measurement: the existing webhook, $DISCORD_WEBHOOK_URL
#   - discord-cluster: the new cluster-alerts webhook, $DISCORD_CLUSTER_WEBHOOK_URL
# Both URLs are secrets: Grafana expands the variables from the environment at
# provisioning time (envValueFrom in ../application.yaml reads them from the
# SOPS-managed Secret local-monitoring-grafana-alerting, keys discord-webhook-url
# and discord-cluster-webhook-url), so this file never contains a URL and the
# ConfigMap is safe to read.
#
# The root receiver is discord-cluster deliberately: it is the catch-all, so
# anything that matches no route below -- including Grafana's own
# DatasourceError/NoData alerts for the cluster rules -- reaches the cluster
# channel rather than the market one (Grafana always has a root receiver, so
# the alternative to this choice was misrouting, not silence). Routing is by
# the grafana_folder label, which Grafana attaches to every alert and which
# both rule sets already honour through provisioning: the market rules land in
# the `Market measurement` folder and the converted kube-prometheus rules in
# `Kubernetes`. The market rules do carry a system label (market-measurement
# x11, market-research x6), but routing on it would mean adding a label to all
# 79 converted rules just to re-describe a folder that provisioning already
# assigns, and it would not cover the DatasourceError/NoData alerts above,
# which carry no system label. The severity=info route exists only to slow the
# repeat interval to 24h for the low-severity kube-prometheus alerts; it points
# at the same receiver as the root.
#
# The grafana_alert label is what the chart's k8s-sidecar watches; each key
# becomes a file under /etc/grafana/provisioning/alerting and Grafana's
# provisioning reload is called on change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-monitoring-grafana-notifications
  labels:
    grafana_alert: "1"
data:
  notifications.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: homelab
        template: |
          {{ define "homelab.title" -}}
          {{ if eq .Status "firing" }}[FIRING{{ if .Alerts.Firing }} {{ len .Alerts.Firing }}{{ end }}]{{ else }}[RESOLVED]{{ end }}
          {{- with .GroupLabels.alertname }} {{ . }}{{ end }}
          {{- with .CommonLabels.severity }} ({{ . }}){{ end }}
          {{- end }}

          {{ define "homelab.scope" -}}
          {{ with .Labels.name }} `app={{ . }}`{{ end }}
          {{- with .Labels.node }} `node={{ . }}`{{ end }}
          {{- if not .Labels.node }}{{ with .Labels.instance }} `at={{ . }}`{{ end }}{{ end }}
          {{- with .Labels.namespace }} `ns={{ . }}`{{ end }}
          {{- with .Labels.pod }} `pod={{ . }}`{{ end }}
          {{- with .Labels.job_name }} `job={{ . }}`{{ end }}
          {{- with .Labels.daemonset }} `ds={{ . }}`{{ end }}
          {{- with .Labels.deployment }} `deploy={{ . }}`{{ end }}
          {{- with .Labels.statefulset }} `sts={{ . }}`{{ end }}
          {{- with .Labels.mountpoint }} `mount={{ . }}`{{ end }}
          {{- with .Labels.site }} `site={{ . }}`{{ end }}
          {{- if not .Labels.pod }}{{ if not .Labels.node }}{{ with .Labels.job }} `scrape={{ . }}`{{ end }}{{ end }}{{ end }}
          {{- end }}

          {{ define "homelab.detail" -}}
          **{{ .Labels.alertname }}**{{ with .Labels.severity }} · `{{ . }}`{{ end }}
          {{ with .Annotations.summary }}{{ . }}
          {{ end }}{{ with .Annotations.description }}> {{ . }}
          {{ end }}on:{{ template "homelab.scope" . }}
          since {{ .StartsAt.Format "Jan 02 15:04 MST" }}{{ with .PanelURL }} · [chart]({{ . }}){{ end }}

          {{ end }}

          {{ define "homelab.compact" -}}
          **{{ .Labels.alertname }}**{{ with .Labels.severity }} · `{{ . }}`{{ end }}
          {{ with .Annotations.summary }}{{ . }}
          {{ end }}on:{{ template "homelab.scope" . }}

          {{ end }}

          {{ define "homelab.brief" -}}
          - {{ .Labels.alertname }}{{ template "homelab.scope" . }}
          {{ end }}

          {{ define "homelab.message" -}}
          {{ if .Alerts.Firing }}**{{ len .Alerts.Firing }} firing**

          {{ if le (len .Alerts.Firing) 2 }}{{ range .Alerts.Firing }}{{ template "homelab.detail" . }}{{ end }}
          {{- else if le (len .Alerts.Firing) 6 }}{{ range .Alerts.Firing }}{{ template "homelab.compact" . }}{{ end }}
          {{- else }}{{ range slice .Alerts.Firing 0 6 }}{{ template "homelab.compact" . }}{{ end }}_showing 6 of {{ len .Alerts.Firing }} — open the dashboard for the rest_
          {{ end }}
          {{- end }}
          {{- if .Alerts.Resolved }}
          **{{ len .Alerts.Resolved }} resolved**
          {{ if gt (len .Alerts.Resolved) 6 }}{{ range slice .Alerts.Resolved 0 6 }}{{ template "homelab.brief" . }}{{ end }}_and more, {{ len .Alerts.Resolved }} in total_
          {{ else }}{{ range .Alerts.Resolved }}{{ template "homelab.brief" . }}{{ end }}{{ end }}
          {{- end }}
          {{- end }}
    contactPoints:
      - orgId: 1
        name: discord-market-measurement
        receivers:
          - uid: discord-market-measurement
            type: discord
            disableResolveMessage: false
            settings:
              url: $DISCORD_WEBHOOK_URL
              use_discord_username: true
              # Render the message as the embed description so it sits with the
              # panel screenshots Grafana attaches as sibling embeds. The 2000
              # rune cap applies either way (the notifier truncates before this
              # branch), and no template uses @mentions, which are the one thing
              # that stops working from an embed.
              use_embed_description: true
              title: '{{ template "homelab.title" . }}'
              message: '{{ template "homelab.message" . }}'
      - orgId: 1
        name: discord-cluster
        receivers:
          - uid: discord-cluster
            type: discord
            disableResolveMessage: false
            settings:
              url: $DISCORD_CLUSTER_WEBHOOK_URL
              use_discord_username: true
              # Render the message as the embed description so it sits with the
              # panel screenshots Grafana attaches as sibling embeds. The 2000
              # rune cap applies either way (the notifier truncates before this
              # branch), and no template uses @mentions, which are the one thing
              # that stops working from an embed.
              use_embed_description: true
              title: '{{ template "homelab.title" . }}'
              message: '{{ template "homelab.message" . }}'
    policies:
      - orgId: 1
        receiver: discord-cluster
        group_by:
          - grafana_folder
          - alertname
          - site
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: discord-market-measurement
            object_matchers:
              - [grafana_folder, "=", "Market measurement"]
          - receiver: discord-cluster
            object_matchers:
              - [severity, "=", "info"]
            repeat_interval: 24h
