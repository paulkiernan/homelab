---
# Manifests for the local-monitoring ArgoCD app (see ../application.yaml for the
# architecture and the boundary with the grafana-cloud collector app).
#
# Four of the ConfigMaps here are generated files. The Kubernetes dashboards,
# cluster alert rules and Prometheus recording rules come from the upstream
# files vendored under ../upstream/ by ../fetch-upstream.py; the homelab
# alerting rules come from ../alerts/*.yaml and the homelab dashboards from
# ../dashboards/*.json, both hand-authored source in this repository. The
# hand-authored dashboards are provisioned through the Kubernetes dashboards
# ConfigMap below rather than one of their own, so they land in the same
# `Kubernetes` Grafana folder as the vendored set. Regenerate from this app's
# directory with
#
#   python3 fetch-upstream.py            # re-vendor and re-verify upstream/
#   python3 fetch-upstream.py --check    # re-hash the vendored files, no network
#   python3 generate-assets.py           # write
#   python3 generate-assets.py --check   # fail if they drifted from source
#
# They are checked in because ArgoCD must provision from this repository alone.
# Neither the dashboards nor the alert rules may be hand-edited here; change the
# source assets and re-run the generator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # SOPS-encrypted Grafana admin credentials (isindir.github.com/v1alpha3).
  - grafana-admin-secret.sops.yaml
  # SOPS-encrypted alert delivery secret (Discord webhook URL), exposed to
  # Grafana as $DISCORD_CLUSTER_WEBHOOK_URL for the notifications ConfigMap below.
  - grafana-alerting-secret.sops.yaml
  # Kubernetes dashboards, Grafana-managed cluster alert rules and Prometheus
  # recording rules, generated from ../upstream/ by generate-assets.py — do not
  # hand-edit these three. The dashboards ConfigMap also carries the
  # hand-authored ../dashboards/*.json, which share the same Grafana folder.
  - grafana-dashboards-kubernetes-configmap.yaml
  - grafana-alerting-kubernetes-configmap.yaml
  - prometheus-rules-configmap.yaml
  # Homelab alert rules generated from the hand-authored ../alerts/*.yaml (not
  # vendored): cluster capacity from
  # homelab-capacity.yaml and ArgoCD reconciliation from argocd-gitops.yaml, one
  # provisioning key per source file — do not hand-edit this one either.
  - grafana-alerting-homelab-configmap.yaml
  # Contact point + root notification policy (hand-maintained, no secrets),
  # plus the tombstones.yaml key that deletes retired rules and contact points
  # from Grafana's database.
  - grafana-notifications-configmap.yaml
  # Private tailnet access to the Grafana UI. No public hostname anywhere.
  - tailscale-ingress.yaml
