---
# Manifests for the local-monitoring ArgoCD app (see ../application.yaml for the
# architecture and the boundary with the grafana-cloud collector app).
#
# Six of the ConfigMaps here are generated files. The market ones
# (grafana-dashboards-, grafana-alerting-) come from the canonical definitions
# in paulkiernan/diff-logic-cells; the Kubernetes dashboards, cluster alert
# rules and Prometheus recording rules come from the upstream files vendored
# under ../upstream/ by ../fetch-upstream.py; the homelab cluster capacity
# alerting rules come from ../alerts/homelab-capacity.yaml, which is
# hand-authored source in this repository. Regenerate from this app's directory
# with
#
#   python3 fetch-upstream.py            # re-vendor and re-verify upstream/
#   python3 fetch-upstream.py --check    # re-hash the vendored files, no network
#   python3 generate-assets.py           # write
#   python3 generate-assets.py --check   # fail if they drifted from source
#
# They are checked in because ArgoCD must provision from this repository alone.
# Neither the dashboards nor the alert rules may be hand-edited here; change the
# source assets and re-run the generator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # SOPS-encrypted Grafana admin credentials (isindir.github.com/v1alpha3).
  - grafana-admin-secret.sops.yaml
  # SOPS-encrypted alert delivery secret (Discord webhook URL), exposed to
  # Grafana as $DISCORD_WEBHOOK_URL for the notifications ConfigMap below.
  - grafana-alerting-secret.sops.yaml
  # Grafana dashboard JSON + unified-alerting rule groups (generated).
  - grafana-dashboards-configmap.yaml
  - grafana-alerting-configmap.yaml
  # Kubernetes dashboards, Grafana-managed cluster alert rules and Prometheus
  # recording rules, generated from ../upstream/ by generate-assets.py — do not
  # hand-edit these three.
  - grafana-dashboards-kubernetes-configmap.yaml
  - grafana-alerting-kubernetes-configmap.yaml
  - prometheus-rules-configmap.yaml
  # Cluster capacity alert rules generated from the hand-authored
  # ../alerts/homelab-capacity.yaml (not vendored and not from
  # diff-logic-cells) — do not hand-edit this one either.
  - grafana-alerting-homelab-configmap.yaml
  # Contact point + root notification policy (hand-maintained, no secrets).
  - grafana-notifications-configmap.yaml
  # Private tailnet access: grafana UI, and the metrics-ingest receiver for the
  # capture VM's Alloy. No public hostname anywhere.
  - tailscale-ingress.yaml
