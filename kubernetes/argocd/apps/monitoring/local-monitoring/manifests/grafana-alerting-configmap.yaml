# Generated by generate-assets.py from deploy/grafana in paulkiernan/diff-logic-cells — do not edit by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-monitoring-grafana-alerting
  labels:
    grafana_alert: '1'
data:
  rules.yaml: "apiVersion: 1\ngroups:\n- orgId: 1\n  name: market-measurement-capture\n  folder: Market measurement\n  interval: 60s\n  rules:\n  - uid: market-recorder-capture-disconnected\n    title: '[market-measurement] capture disconnected or telemetry missing'\n    condition: C\n    for: 2m\n    noDataState: Alerting\n    execErrState: Error\n    labels:\n      severity: critical\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} (site {{ $labels.site }}): market_recorder_connected is 0, or this instance stopped reporting entirely.'\n      description: 'Evaluated PER INSTANCE on purpose: there is no global max/min, so a site that loses its feed still fires while another site stays healthy. A missing series (no data) means that capture host is not being scraped at all — cloud capture hosts push to Grafana Cloud through their own Alloy unit. Check the recorder''s /healthz and /readyz, the pod or systemd unit, and (for cloud hosts) the market-recorder-alloy unit.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: market_recorder_connected\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A < 1\n        refId: C\n        type: math\n  - uid: market-recorder-feed-stale\n    title: '[market-measurement] no venue messages received'\n    condition: C\n    for: 5m\n    noDataState: Alerting\n    execErrState: Error\n    labels:\n      severity: critical\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} (site {{ $labels.site }}): no venue message for more than two minutes.'\n      description: 'Per instance, no aggregation: heartbeats alone should keep this fresh even when a product is quiet, so silence means that host''s feed or connection is broken. Check recorder logs for reconnect/error events and the sequence_gaps counter.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: time() - market_recorder_last_message_unixtime_seconds\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 120\n        refId: C\n        type: math\n  - uid: market-recorder-no-durable-writes\n    title: '[market-measurement] no durable record written'\n    condition: C\n    for: 5m\n    noDataState: Alerting\n    execErrState: Error\n    labels:\n      severity: warning\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} (site {{ $labels.site }}): nothing reached durable storage for more than ten minutes.'\n      description: 'Per instance. Messages may still be arriving while nothing reaches the spool: full spool volume, blocked writer, or fsync failures. Raw data is never deleted automatically, so free space has to be reclaimed deliberately after archive verification — on a cloud capture host the spool shares the root filesystem, so the disk-capacity rule below is the early warning.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: time() - market_recorder_last_durable_record_unixtime_seconds\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n\
    \        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 600\n        refId: C\n        type: math\n  - uid: market-recorder-queue-overflow\n    title: '[market-measurement] writer queue overflowed'\n    condition: C\n    for: 0s\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} (site {{ $labels.site }}): the bounded writer queue overflowed.'\n      description: Per instance. Records could not be queued, so that host's capture window is incomplete rather than continuous — treat the affected window as lossy in the report instead of assuming full coverage.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: increase(market_recorder_queue_overflows_total[15m])\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 0\n        refId: C\n        type: math\n  - uid: market-recorder-sequence-gaps\n    title: '[market-measurement] sequence gap invalidated a book'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} (site {{ $labels.site }}): sequence_num gap detected.'\n      description: Per instance. sequence_num is global per connection, so a gap means messages were missed and the recorder must resnapshot; books stay invalid until the new snapshot arrives and the affected window is an explicit data-quality event.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: increase(market_recorder_sequence_gaps_total[15m])\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 0\n        refId: C\n        type: math\n  - uid: market-recorder-reconnect-churn\n    title: '[market-measurement] reconnect churn while disconnected'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} (site {{ $labels.site }}): repeated reconnects and the feed is still down.'\n      description: 'Conditioned on purpose: more than three reconnects in fifteen minutes only alerts while market_recorder_connected is 0, so normal session cycling on a healthy feed stays quiet. Every reconnect forces a resnapshot, and the window between the break and the new snapshot is a known data-quality gap.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: increase(market_recorder_reconnects_total[15m])\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: B\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n \
    \       expr: market_recorder_connected\n        instant: true\n        range: false\n        refId: B\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 3 && $B < 1\n        refId: C\n        type: math\n  - uid: market-recorder-errors\n    title: '[market-measurement] recorder reported errors'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} (site {{ $labels.site }}): recorder error counter increased.'\n      description: Per instance. Parse failures, rejected redirects, discovery failures or write errors were reported; each one is an explicit event in the spool. Check the host's logs and the affected chunk's lifecycle records.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: increase(market_recorder_errors_total[15m])\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 0\n        refId: C\n        type: math\n  - uid: market-capture-host-disk-low\n    title: '[market-measurement] capture host disk almost full'\n    condition: C\n    for: 15m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} {{ $labels.mountpoint }}: less than 15% filesystem free.'\n      description: The spool is never pruned automatically, and on a cloud capture host it shares the root filesystem, so this is the early warning for capture stopping on a full disk. Reclaim space by pruning sealed chunks only after they are verified on the archive destination.\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: 100 * node_filesystem_avail_bytes{job=\"market-capture-host\",fstype!~\"tmpfs|ramfs|overlay\"} / node_filesystem_size_bytes{job=\"market-capture-host\",fstype!~\"tmpfs|ramfs|overlay\"}\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A < 15\n        refId: C\n        type: math\n  - uid: market-recorder-scrape-target-down\n    title: '[market-measurement] scrape target down'\n    condition: C\n    for: 5m\n    noDataState: Alerting\n    execErrState: Error\n    labels:\n      severity: critical\n      system: market-measurement\n    annotations:\n      summary: '{{ $labels.instance }} ({{ $labels.job }}): up == 0.'\n      description: 'The target still exists but cannot be scraped: the recorder process died while its host or pod is still there, or a capture host''s Alloy host exporter is failing. Distinct from a completely missing series, which the per-site absence rules below cover.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: up{job=~\"market-recorder|market-capture-host\"}\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n     \
    \   maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A < 1\n        refId: C\n        type: math\n  - uid: recorder-site-absent-homelab\n    title: '[market-measurement] expected site silent: homelab'\n    condition: C\n    for: 0s\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      site: homelab\n      system: market-measurement\n    annotations:\n      summary: Expected capture site homelab has produced no market_recorder_connected sample for 15 minutes.\n      description: 'Explicit expectation, not inference: the site list is an input to the provisioning script, so a capture VM that never started, or whose Alloy stopped pushing, alerts even though it never appeared in the data. One rule per expected site means a healthy homelab can never mask a silent cloud site, and noDataState cannot be relied on here because the query returns other sites'' series.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: absent_over_time(market_recorder_connected{site=\"homelab\"}[15m])\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 0\n        refId: C\n        type: math\n  - uid: recorder-site-absent-aws-us-east-1\n    title: '[market-measurement] expected site silent: aws-us-east-1'\n    condition: C\n    for: 0s\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      site: aws-us-east-1\n      system: market-measurement\n    annotations:\n      summary: Expected capture site aws-us-east-1 has produced no market_recorder_connected sample for 15 minutes.\n      description: 'Explicit expectation, not inference: the site list is an input to the provisioning script, so a capture VM that never started, or whose Alloy stopped pushing, alerts even though it never appeared in the data. One rule per expected site means a healthy homelab can never mask a silent cloud site, and noDataState cannot be relied on here because the query returns other sites'' series.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: absent_over_time(market_recorder_connected{site=\"aws-us-east-1\"}[15m])\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 0\n        refId: C\n        type: math\n- orgId: 1\n  name: market-research-report-freshness\n  folder: Market measurement\n  interval: 60s\n  rules:\n  - uid: research-report-missing-homelab\n    title: '[market-research] expected site has no usable report: homelab'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      site: homelab\n      system: market-research\n    annotations:\n      summary: Expected site homelab has no usable report.\n      description: 'Evaluated PER SITE with no aggregation: the site list is an input, so a host whose report never appeared alerts even though it was never in the data. Two independent ways to be unavailable are combined here, and both land on 1 before the $A > 0 test: market_research_report_available{site=...} < bool 1\
    \ is 1 when the sample is 0 (missing, invalid, cross-site or hash-mismatched report — the exporter renders those as 0 and emits no derived series) and 0 when the report is healthy; absent_over_time(...[15m]) is 1 only when that site''s series has not been pushed at all for the whole window (exporter down, no report ever parsed, or telemetry not reaching the datasource), so a missing series is the slower of the two paths while a bad sample is visible on the first evaluation. The comparison must stay bool: a plain ''< 1'' filters and returns the original 0, which $A > 0 would read as false. The rule fires after the condition holds for 5 minutes. Check the market-research exporter''s /healthz and /readyz, its logs, and the report CronJob''s last run before assuming a capture problem: this rule says the report cannot be trusted or is absent, not why.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: absent_over_time(market_research_report_available{site=\"homelab\"}[15m]) or (market_research_report_available{site=\"homelab\"} < bool 1)\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 0\n        refId: C\n        type: math\n  - uid: research-report-missing-aws-us-east-1\n    title: '[market-research] expected site has no usable report: aws-us-east-1'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      site: aws-us-east-1\n      system: market-research\n    annotations:\n      summary: Expected site aws-us-east-1 has no usable report.\n      description: 'Evaluated PER SITE with no aggregation: the site list is an input, so a host whose report never appeared alerts even though it was never in the data. Two independent ways to be unavailable are combined here, and both land on 1 before the $A > 0 test: market_research_report_available{site=...} < bool 1 is 1 when the sample is 0 (missing, invalid, cross-site or hash-mismatched report — the exporter renders those as 0 and emits no derived series) and 0 when the report is healthy; absent_over_time(...[15m]) is 1 only when that site''s series has not been pushed at all for the whole window (exporter down, no report ever parsed, or telemetry not reaching the datasource), so a missing series is the slower of the two paths while a bad sample is visible on the first evaluation. The comparison must stay bool: a plain ''< 1'' filters and returns the original 0, which $A > 0 would read as false. The rule fires after the condition holds for 5 minutes. Check the market-research exporter''s /healthz and /readyz, its logs, and the report CronJob''s last run before assuming a capture problem: this rule says the report cannot be trusted or is absent, not why.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: absent_over_time(market_research_report_available{site=\"aws-us-east-1\"}[15m]) or (market_research_report_available{site=\"aws-us-east-1\"} < bool 1)\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 0\n        refId: C\n        type: math\n  - uid: research-report-stale-homelab\n    title: '[market-research] report publication stale for site: homelab'\n    condition: C\n    for: 5m\n    noDataState: OK\n \
    \   execErrState: Error\n    labels:\n      severity: warning\n      site: homelab\n      system: market-research\n    annotations:\n      summary: 'Site homelab: the published report is more than 26 hours old.'\n      description: 'market_research_report_timestamp_seconds is the report.json filesystem mtime, so this is publication freshness, not market time: the report is being read, but nothing new has been published for over a day. 26 hours keeps the daily cadence with margin — a daily run plus one late hour stays quiet — while a genuinely stopped report pipeline fires. Per site, no aggregation. The absence case (series never pushed) belongs to the report-unavailable rule; this one deliberately uses noDataState OK so the two failures are not double-reported.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: time() - market_research_report_timestamp_seconds{site=\"homelab\"}\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 93600\n        refId: C\n        type: math\n  - uid: research-report-stale-aws-us-east-1\n    title: '[market-research] report publication stale for site: aws-us-east-1'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      site: aws-us-east-1\n      system: market-research\n    annotations:\n      summary: 'Site aws-us-east-1: the published report is more than 26 hours old.'\n      description: 'market_research_report_timestamp_seconds is the report.json filesystem mtime, so this is publication freshness, not market time: the report is being read, but nothing new has been published for over a day. 26 hours keeps the daily cadence with margin — a daily run plus one late hour stays quiet — while a genuinely stopped report pipeline fires. Per site, no aggregation. The absence case (series never pushed) belongs to the report-unavailable rule; this one deliberately uses noDataState OK so the two failures are not double-reported.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: time() - market_research_report_timestamp_seconds{site=\"aws-us-east-1\"}\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 93600\n        refId: C\n        type: math\n  - uid: research-capture-stale-homelab\n    title: '[market-research] capture end older than 28h for site: homelab'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      site: homelab\n      system: market-research\n    annotations:\n      summary: 'Site homelab: the newest captured data in the report is more than 28 hours old.'\n      description: 'market_research_capture_end_timestamp_seconds is the newest usable sealed chunk in the report, so this fires when capture stopped while reporting still works. The threshold is deliberately 28 hours, not a few hours: the report is produced in daily runs, a quiet venue still keeps heartbeats fresh on a live capture host, and anything shorter would page on the report cadence rather than on a capture outage. Per site, no aggregation; noDataState OK because a site that has never produced usable chunks is covered by the report-unavailable rule.'\n    data:\n    - refId: A\n     \
    \ queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: time() - market_research_capture_end_timestamp_seconds{site=\"homelab\"}\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 100800\n        refId: C\n        type: math\n  - uid: research-capture-stale-aws-us-east-1\n    title: '[market-research] capture end older than 28h for site: aws-us-east-1'\n    condition: C\n    for: 5m\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: warning\n      site: aws-us-east-1\n      system: market-research\n    annotations:\n      summary: 'Site aws-us-east-1: the newest captured data in the report is more than 28 hours old.'\n      description: 'market_research_capture_end_timestamp_seconds is the newest usable sealed chunk in the report, so this fires when capture stopped while reporting still works. The threshold is deliberately 28 hours, not a few hours: the report is produced in daily runs, a quiet venue still keeps heartbeats fresh on a live capture host, and anything shorter would page on the report cadence rather than on a capture outage. Per site, no aggregation; noDataState OK because a site that has never produced usable chunks is covered by the report-unavailable rule.'\n    data:\n    - refId: A\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: market-prometheus\n      model:\n        editorMode: code\n        expr: time() - market_research_capture_end_timestamp_seconds{site=\"aws-us-east-1\"}\n        instant: true\n        range: false\n        refId: A\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      queryType: ''\n      relativeTimeRange:\n        from: 900\n        to: 0\n      datasourceUid: __expr__\n      model:\n        datasource:\n          type: __expr__\n          uid: __expr__\n        expression: $A > 100800\n        refId: C\n        type: math\n"
