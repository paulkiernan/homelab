---
# Cluster monitoring backend: metrics, logs, dashboards and alert evaluation.
#
# WHY THIS APP EXISTS
# Grafana Cloud is the fallback, not the primary: the SaaS tenant hit its
# active-series limit and remote-write pushes were rejected with HTTP 429 in
# the observed 2026-09-17 window, so an active Alloy is never proof that
# metrics arrive; it is also a paid dependency. This app keeps the metrics
# store, the log store, the dashboards and the alert evaluation inside the
# cluster, on node-local disks, and leaves only a small bounded health signal
# in Grafana Cloud. No paid upgrade is assumed anywhere here.
#
# BOUNDARY WITH THE SIBLING APP
# kubernetes/argocd/apps/monitoring/grafana-cloud owns the collectors and the
# telemetry services: the k8s-monitoring Alloy DaemonSet/StatefulSet, the
# kube-state-metrics, node-exporter, kepler and opencost workloads it deploys,
# and the bounded metrics subset that still remote-writes off-site to Grafana
# Cloud. Alloy remote-writes the full cluster metric set to
# prometheus-server.monitoring.svc.cluster.local/api/v1/write and pushes pod
# logs and cluster events to loki.monitoring.svc.cluster.local:3100, exactly
# like the capture VM's Alloy unit pushes market_recorder_* and the report
# exporter's market_research_* series through the private metrics-ingest
# ingress below. This app only receives, stores and evaluates: it must not
# create a second node-exporter, kube-state-metrics, pushgateway or a
# Prometheus Operator, because the collectors that already exist own that.
#
# WHAT IS IN HERE
# This app is the primary for everything about the cluster, not only for the
# market capture stack: Kubernetes, node, cost and energy dashboards, the
# kube-prometheus alert set, pod logs and cluster events all live here.
#   * prometheus-community/prometheus 29.31.1 (Prometheus v3.14.0), release
#     name `prometheus` so the Service is exactly `prometheus-server`. It
#     holds the TSDB and evaluates the generated recording rules; alerting is
#     not its job.
#   * grafana 13.2.5 (Grafana 13.2.2), release name `grafana`, from the
#     community-maintained chart repository. The chart published from
#     grafana.github.io is deprecated at its final version (10.5.15,
#     2026-01-30) and stopped receiving Grafana releases; the community
#     repository is the maintained continuation of the same chart.
#   * grafana/loki 7.3.0, release name `loki`, SingleBinary with a filesystem
#     store: pod logs and cluster events, node-local for the same reason as
#     the TSDB. The chart's appVersion is 3.6.12, but its values pin
#     loki.image.tag to 3.6.11 and nothing here overrides that, so the
#     StatefulSet runs docker.io/grafana/loki:3.6.11.
#   * manifests/: the SOPS admin and alerting Secrets, the generated Grafana
#     provisioning ConfigMaps and the generated Prometheus rules ConfigMap
#     (produced by generate-assets.py from the vendored upstream/ files, and
#     from deploy/grafana in paulkiernan/diff-logic-cells for the market
#     assets), plus the two private Tailscale ingresses.
#
# Grafana serves two folders, both provisioned from this repository with
# nothing imported by hand: `Market measurement` (the capture-stack dashboards
# and rules, the presentation contract shared with diff-logic-cells) and
# `Kubernetes` (the vendored upstream Kubernetes/node/OpenCost/Kepler
# dashboards plus the converted kube-prometheus alert rules).
#
# ALERT DELIVERY
# Grafana unified alerting evaluates every rule and delivers through two
# provisioned Discord contact points: market-measurement alerts to
# $DISCORD_WEBHOOK_URL and cluster alerts to $DISCORD_CLUSTER_WEBHOOK_URL,
# both expanded from the alerting SopsSecret. No Alertmanager is involved.
#
# PROVISIONED GRAFANA IS DISPOSABLE
# Datasources, dashboards and alert rules are provisioned from this
# repository on every sync; there is no state to migrate from the Grafana
# Cloud side and no object is imported. Dashboards and alerts may be discarded
# and re-created freely; only the Prometheus TSDB (openebs-hostpath PVC), the
# Loki chunks (openebs-hostpath PVC) and Grafana's own small sqlite volume
# matter.
#
# PRIVATE ACCESS ONLY
# Neither UI nor receiver is exposed publicly: the Prometheus Service is
# ClusterIP and the only outside path is the Tailscale operator's tailnet
# ingress, which authenticates by tailnet membership (and then by whatever the
# tailnet ACLs allow). No basic auth or bearer token sits in front of
# remote-write for the VM; if a credential is ever wanted there, add
# --web.config.file to `server.extraFlags` and a SOPS Secret together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-monitoring
  namespace: argocd
  annotations:
    # After the collectors' app (grafana-cloud, wave 1) so the namespace exists
    # and the routing that feeds this backend is in place first.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - path: kubernetes/argocd/apps/monitoring/local-monitoring/manifests
      repoURL: https://github.com/paulkiernan/homelab
      targetRevision: HEAD
    - chart: prometheus
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 29.34.0
      helm:
        releaseName: prometheus
        valuesObject:
          server:
            # --- receiver, not scraper -------------------------------------
            # Alloy already discovers ServiceMonitors/exporters and pushes the
            # full set; enabling the receiver is the only ingestion path, so
            # every bundled scrape job is switched off below instead of
            # duplicating the collectors the grafana-cloud app owns.
            extraFlags:
              - web.enable-remote-write-receiver
            global:
              scrape_interval: 1m
              scrape_timeout: 10s
              evaluation_interval: 1m
            # --- retention and disk ----------------------------------------
            # openebs-hostpath on purpose: a local disk path, never NFS, for
            # the same reason the capture spool refuses NFS (a NAS stall must
            # not sit on the write path). The volume is node-local, so this pod
            # is pinned to the worker set below and data survives pods, not
            # node loss.
            #
            # The 20Gi claim with 14GB retentionSize is the hard bound here:
            # Prometheus keeps WAL and compaction headroom on top of the
            # retained blocks, and openebs-hostpath does not enforce the claim
            # size (the node's free disk is the real bound), so retentionSize
            # wins if the two bounds ever disagree. 60d is best-effort within
            # that cap — what the 8-week measurement review needs, not a
            # guarantee.
            retention: 60d
            retentionSize: 14GB
            persistentVolume:
              enabled: true
              accessModes:
                - ReadWriteOnce
              size: 20Gi
              storageClass: openebs-hostpath
              annotations:
                # A sync, prune or future helm release must never delete TSDB.
                argocd.argoproj.io/sync-options: Prune=false,Delete=false
                helm.sh/resource-policy: keep
            # openebs-hostpath serves this claim as a `local` volume (the PV is
            # spec.local, provisioner openebs.io/local), and kubelet does apply
            # the pod's fsGroup to local volumes — hostPath is the volume type
            # that ignores it. The chart runs Prometheus as nobody (65534) and
            # the provisioner creates the directory root-owned, so hand it over
            # once, non-recursively and independently of kubelet's mount-time
            # ownership pass: everything below it is created by Prometheus.
            #
            # The chart renders server.extraInitContainers verbatim — it injects
            # neither a volumeMount nor capabilities — so both are spelled out
            # here: without the mount the chown sees no /data (ENOENT) and
            # without CAP_CHOWN it fails EPERM. The volume name is the chart's
            # storage volume for this release (no statefulSetNameOverride set);
            # it must be re-checked when the chart is upgraded.
            extraInitContainers:
              - name: data-permissions
                image: busybox:1.37
                command:
                  - sh
                  - -c
                  - chown 65534:65534 /data
                securityContext:
                  runAsNonRoot: false
                  runAsUser: 0
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                    add:
                      - CHOWN
                      - FOWNER
                volumeMounts:
                  - name: storage-volume
                    mountPath: /data
            # --- placement ------------------------------------------------
            # Small cluster: workers 01-03 only. The leader is already at ~82%
            # memory and worker-04 is unavailable, so neither may be selected.
            # Worker-03 has the most headroom today, hence the preference.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - k8s-worker-01
                            - k8s-worker-02
                            - k8s-worker-03
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - k8s-worker-03
            # --- resources -------------------------------------------------
            # Sized for the full cluster series set, not just the market
            # capture stack: the collectors now also ship the node-exporter,
            # kube-state-metrics and kepler additions that the vendored
            # dashboards and rules need, so series grow from ~14.5k to roughly
            # 22-25k, and the 53 generated recording rules evaluate every 1m
            # against them. The previous 512Mi/1536Mi sized a receiver-only
            # server.
            resources:
              requests:
                cpu: 250m
                memory: 768Mi
              limits:
                cpu: "1"
                memory: 2Gi
            # --- generated recording rules ----------------------------------
            # generate-assets.py writes the rules converted from the
            # kube-prometheus PrometheusRules into the
            # local-monitoring-prometheus-rules ConfigMap; `serverFiles` below
            # loads every *.yml in it, and the chart turns this mount into the
            # volume `<server.name>-rules`. Alerting rules are not in there:
            # Grafana unified alerting owns them.
            extraConfigmapMounts:
              - name: rules
                mountPath: /etc/prometheus-rules
                subPath: ""
                configMap: local-monitoring-prometheus-rules
                readOnly: true
            # --- surface --------------------------------------------------
            # The only Service in front of it; ClusterIP, port 80 -> 9090.
            # Remote-write: http://prometheus-server.monitoring.svc.cluster.local/api/v1/write
            service:
              type: ClusterIP
              servicePort: 80
            # The server does not talk to the Kubernetes API at all here (no
            # kubernetes_sd scrape configs below), so it gets no token.
            automountServiceAccountToken: false
          # No ClusterRole/ClusterRoleBinding: nothing scrapes through the API.
          rbac:
            create: false
          # Every chart-bundled scrape job is for a Prometheus that discovers
          # the cluster itself: API servers, nodes, cAdvisor, pods, pod/service
          # endpoints, service probes, both pushgateway jobs and the chart's
          # own self job. Alloy already covers exactly that ground and
          # remote-writes the result, so each one is disabled explicitly — the
          # values merge would keep them enabled otherwise. Anything the chart
          # adds later must be disabled here on upgrade.
          scrapeConfigs:
            kubernetes-api-servers:
              enabled: false
            kubernetes-nodes:
              enabled: false
            kubernetes-nodes-cadvisor:
              enabled: false
            kubernetes-pods:
              enabled: false
            kubernetes-pods-slow:
              enabled: false
            kubernetes-service-endpoints:
              enabled: false
            kubernetes-service-endpoints-slow:
              enabled: false
            kubernetes-services:
              enabled: false
            prometheus:
              enabled: false
            prometheus-pushgateway:
              enabled: false
          # --- self-scrape plus the generated recording rules --------------
          # Exactly one scrape job, the server itself, so Grafana can show
          # TSDB/receiver health. Everything else arrives by remote-write.
          # rule_files loads the generated recording rules — the upstream
          # kube-prometheus ones with their selectors rewritten to the Alloy
          # job labels; there are no alerting rules here.
          serverFiles:
            prometheus.yml:
              rule_files:
                - /etc/prometheus-rules/*.yml
              scrape_configs:
                - job_name: prometheus
                  static_configs:
                    - targets:
                        - localhost:9090
          # --- reload in place on rule change -----------------------------
          # The chart renders one --watched-dir= per extraVolumeDirs entry and
          # mounts extraConfigmapMounts into the reloader container, so both
          # keys are needed: the reloader only sees what it has mounted. With
          # them, a recording-rule ConfigMap change calls Prometheus' reload
          # endpoint instead of needing a pod restart.
          configmapReload:
            prometheus:
              extraConfigmapMounts:
                - name: rules
                  mountPath: /etc/prometheus-rules
                  subPath: ""
                  configMap: local-monitoring-prometheus-rules
                  readOnly: true
              extraVolumeDirs:
                - /etc/prometheus-rules
          # --- no bundled duplicates, no Prometheus-side alerting ---------
          # The collectors are owned by grafana-cloud, and Grafana unified
          # alerting evaluates every alert rule. Prometheus itself evaluates
          # only the RECORDING rules loaded above, so there is still no
          # Alertmanager here and no alerting rule file anywhere.
          alertmanager:
            enabled: false
          kube-state-metrics:
            enabled: false
          prometheus-node-exporter:
            enabled: false
          prometheus-pushgateway:
            enabled: false
    - chart: grafana
      repoURL: https://grafana-community.github.io/helm-charts
      targetRevision: 13.2.5
      helm:
        releaseName: grafana
        valuesObject:
          replicas: 1
          deploymentStrategy:
            type: Recreate
          # --- admin credentials ------------------------------------------
          # Created by manifests/grafana-admin-secret.sops.yaml (a SopsSecret
          # whose plaintext is never in git and never printed). Grafana chart
          # keys: admin-user / admin-password.
          admin:
            existingSecret: local-monitoring-grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # --- alert delivery ---------------------------------------------
          # manifests/grafana-notifications-configmap.yaml provisions two
          # Discord contact points whose urls are written as
          # $DISCORD_WEBHOOK_URL and $DISCORD_CLUSTER_WEBHOOK_URL; Grafana
          # expands environment variables in provisioning files, so the two
          # secrets reach it only through these env vars, from the SopsSecret
          # in manifests/grafana-alerting-secret.sops.yaml (keys
          # discord-webhook-url and discord-cluster-webhook-url). The market
          # measurement rules and the cluster rules are routed to their own
          # contact point, so one noisy stream cannot drown the other.
          envValueFrom:
            DISCORD_WEBHOOK_URL:
              secretKeyRef:
                name: local-monitoring-grafana-alerting
                key: discord-webhook-url
            DISCORD_CLUSTER_WEBHOOK_URL:
              secretKeyRef:
                name: local-monitoring-grafana-alerting
                key: discord-cluster-webhook-url
          grafana.ini:
            server:
              root_url: https://grafana.border-enigmatic.ts.net
            analytics:
              reporting_enabled: false
              check_for_updates: false
            security:
              disable_gravatar: true
            users:
              allow_sign_up: false
            unified_alerting:
              # Grafana evaluates the canonical capture rules and the
              # converted kube-prometheus rules itself, against the local
              # Prometheus datasource. There is no in-cluster Alertmanager;
              # Prometheus evaluates recording rules only, every alert rule
              # is evaluated here.
              enabled: true
          # --- datasources --------------------------------------------------
          # UID market-prometheus is the contract shared with the alert rules,
          # the dashboards and the capture VM's Alloy config; uid local-loki is
          # the same kind of contract with the Alloy loki destination, and it
          # is also the path Explore and the log/event panels use. Datasource
          # files are read at Grafana start, so a change here needs a pod
          # restart; dashboards and alert rules reload by themselves (below).
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  uid: market-prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-server.monitoring.svc.cluster.local
                  isDefault: true
                  editable: false
                  jsonData:
                    timeInterval: 30s
                - name: Loki
                  uid: local-loki
                  type: loki
                  access: proxy
                  url: http://loki.monitoring.svc.cluster.local:3100
                  editable: false
          # --- dashboards ---------------------------------------------------
          # Both ConfigMaps are generated: the market one from every
          # deploy/grafana/dashboards/*.json in paulkiernan/diff-logic-cells,
          # the Kubernetes one from the vendored upstream/ files (see
          # fetch-upstream.py for the pins). The chart mounts each
          # dashboardsConfigMaps entry at /var/lib/grafana/dashboards/<key>,
          # which is why those keys must match the provider names below; the
          # file provider reloads them.
          dashboardProviders:
            dashboards.yaml:
              apiVersion: 1
              providers:
                - name: market
                  orgId: 1
                  folder: Market measurement
                  type: file
                  disableDeletion: true
                  allowUiUpdates: false
                  options:
                    path: /var/lib/grafana/dashboards/market
                - name: kubernetes
                  orgId: 1
                  folder: Kubernetes
                  type: file
                  disableDeletion: true
                  allowUiUpdates: false
                  options:
                    path: /var/lib/grafana/dashboards/kubernetes
          dashboardsConfigMaps:
            market: local-monitoring-grafana-dashboards
            kubernetes: local-monitoring-grafana-dashboards-kubernetes
          # --- alert rules --------------------------------------------------
          # The chart's k8s-sidecar watches ConfigMaps labelled grafana_alert
          # and calls Grafana's provisioning reload API, so rule changes apply
          # on sync instead of only at pod start. The selector is a label, not
          # one ConfigMap, so the generated
          # local-monitoring-grafana-alerting-kubernetes rules are picked up
          # with no change here. RBAC is namespace-scoped: that sidecar is
          # granted configmaps (not secrets) in this namespace.
          sidecar:
            alerts:
              enabled: true
              label: grafana_alert
              resource: configmap
              searchNamespace: null
            # kiwigrid/k8s-sidecar is a Python Kubernetes client. At a 64Mi limit
            # it was OOMKilled during startup (exit 137, 2026-09-19 01:29 UTC),
            # and at a 100m CPU limit it stayed pegged for >10 minutes without
            # finishing its initial list (no log line, empty folder), so no
            # alert rule ever provisioned. Startup needs a real core briefly;
            # steady state is idle.
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 1000m
                memory: 256Mi
          rbac:
            namespaced: true
            extraRoleRules:
              - apiGroups:
                  - ""
                resources:
                  - configmaps
                verbs:
                  - get
                  - watch
                  - list
          # --- state --------------------------------------------------------
          # Grafana's own sqlite database (users, alert state, annotations) is
          # node-local too, exactly like the TSDB: the monitoring stack must not
          # lose its database when the NAS it monitors is unavailable, and a
          # single-replica sqlite file has nothing to gain from NFS. The chart's
          # init-chown-data init container hands the openebs-hostpath directory
          # to uid 472. Never pruned by a sync.
          persistence:
            enabled: true
            type: pvc
            storageClassName: openebs-hostpath
            accessModes:
              - ReadWriteOnce
            size: 2Gi
            annotations:
              argocd.argoproj.io/sync-options: Prune=false,Delete=false
              helm.sh/resource-policy: keep
          # --- placement ----------------------------------------------------
          # Same never-leader/never-worker-04 rule as Prometheus. Both volumes
          # are node-local now, so the pod is pinned to the node that binds the
          # claim; preferring workers 01/02 keeps the node hosting the TSDB
          # lighter, and the hard rule keeps the workload off the leader (~82%
          # memory) and off the unavailable worker-04.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-worker-01
                          - k8s-worker-02
                          - k8s-worker-03
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 60
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-worker-01
                          - k8s-worker-02
          # --- resources ----------------------------------------------------
          # The Kubernetes folder adds 18 dashboards and the cluster alert set
          # adds 79 provisioned rules to what the market folder already loads;
          # the previous 512Mi limit was sized for the market folder alone.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          service:
            type: ClusterIP
            port: 80
          testFramework:
            enabled: false
    # --- log store ---------------------------------------------------------
    # Pod logs and cluster events, shipped here by the grafana-cloud app's
    # Alloy (its loki destination points at this Service) and queried from
    # Grafana through datasource uid local-loki. Nothing else writes to it, so
    # there is no second log pipeline to keep in sync.
    - chart: loki
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valuesObject:
          # --- one process, one filesystem ---------------------------------
          # SingleBinary: one small cluster with one writer (Alloy) and one
          # reader (Grafana) has nothing to gain from the microservice
          # topology, and there is no object store to put chunks in. The store
          # is the node-local filesystem for the same reason the TSDB is on
          # openebs-hostpath — a NAS stall must not sit on the log write path.
          # The release name makes the Service exactly `loki`, so Alloy and
          # Grafana address it as loki.monitoring.svc.cluster.local on port
          # 3100.
          deploymentMode: SingleBinary
          loki:
            auth_enabled: false
            commonConfig:
              # One ingester, so one copy of every chunk.
              replication_factor: 1
            storage:
              type: filesystem
              filesystem:
                chunks_directory: /var/loki/chunks
                rules_directory: /var/loki/rules
            schemaConfig:
              configs:
                # tsdb + v13 is the schema family Loki 3.x writes; the start
                # date predates the first log line this cluster ever ships.
                - from: "2024-04-01"
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            limits_config:
              # 30d, but the PVC bound below is what really stops growth: Loki
              # has no size-based retention (only time), so with 20Gi on the
              # node and the observed ~22KB/s of logs this is roughly 6-12GB
              # of compressed chunks. If the claim fills before 30d, lower this
              # rather than moving the volume off node-local disk.
              retention_period: 720h
              reject_old_samples: true
              reject_old_samples_max_age: 168h
              max_cache_freshness_per_query: 10m
              split_queries_by_interval: 15m
              query_timeout: 300s
              volume_enabled: true
            compactor:
              working_directory: /var/loki/compactor
              # Retention only ever runs through the compactor, and deleting
              # filesystem chunks needs the store named explicitly.
              retention_enabled: true
              retention_delete_delay: 2h
              delete_request_store: filesystem
            ingester:
              chunk_encoding: snappy
            querier:
              # Two concurrent queries is what a single Grafana user consumes.
              max_concurrent: 2
            analytics:
              reporting_enabled: false
          # --- no Loki-side alerting ---------------------------------------
          # Alert rules are Grafana-managed, so neither the ruler nor the
          # rules sidecar is started.
          ruler:
            enabled: false
          sidecar:
            rules:
              enabled: false
          # --- the single binary pod ---------------------------------------
          # The chart's podSecurityContext (fsGroup 10001, fsGroupChangePolicy
          # OnRootMismatch) is what makes /var/loki writable for uid 10001: the
          # claim is a `local` volume (PV spec.local), and kubelet applies a
          # pod's fsGroup to local volumes when it mounts them. Grafana is not
          # the precedent for that — its chart ships an explicit init-chown-data
          # running `chown -R 472:472 /var/lib/grafana` (Grafana sets fsGroup
          # 472 as well, but the init container is what owns the directory). If
          # this pod ever logs `permission denied` on /var/loki, the fix is an
          # init container shaped exactly like the Prometheus `data-permissions`
          # one above (chown 10001:10001 /var/loki, volume `storage` mounted
          # there) wired in through singleBinary.initContainers — not loosening
          # the securityContext.
          singleBinary:
            replicas: 1
            persistence:
              enabled: true
              # openebs-hostpath does not enforce the claim size (the node's
              # free disk is the real bound); retention above is the other
              # bound and wins if the two disagree.
              size: 20Gi
              storageClass: openebs-hostpath
              # A sync, prune or future helm release must never delete chunks.
              whenDeleted: Retain
              whenScaled: Retain
              annotations:
                argocd.argoproj.io/sync-options: Prune=false,Delete=false
            # Same rule as Prometheus and Grafana: workers 01-03 only, never
            # the leader (~82% memory) and never the unavailable worker-04.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - k8s-worker-01
                            - k8s-worker-02
                            - k8s-worker-03
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi
            extraEnv:
              # Keeps Go's heap under the container limit so the runtime
              # collects instead of the pod being OOM-killed.
              - name: GOMEMLIMIT
                value: 900MiB
          # --- subcharts and modes that must stay off ----------------------
          # Each of these deploys pods of its own: memcached for the two
          # caches, an nginx gateway in front of Loki, the canary, a minio
          # StatefulSet and the helm test hook. One cluster's log store needs
          # none of them, and Alloy and Grafana address loki:3100 directly (a
          # gateway would be a second entry point to keep in step).
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
          gateway:
            enabled: false
          lokiCanary:
            enabled: false
          test:
            enabled: false
          minio:
            enabled: false
          # SingleBinary renders the one StatefulSet above; these three are the
          # scalable-mode components and must not also render here.
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
